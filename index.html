<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Finder</title>
<meta name="description" content="Live 4-hour trendline break and bounce callouts for futures and stocks, using Tori Trades' trendline strategy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#6a7280;--bd:#dde1e7;--ac:#1b6ef3;--gd:#13894a;--bad:#c93b3b;--warn:#b86e00;--soft:#eef1f6;--line:#1b6ef3;--safe:#d9822b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b93a1;--bd:#2a303a;--ac:#5b9bff;--gd:#3ecf7d;--bad:#ff6b6b;--warn:#f0a63a;--soft:#1f242d;--line:#5b9bff;--safe:#f0a63a}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b93a1;--bd:#2a303a;--ac:#5b9bff;--gd:#3ecf7d;--bad:#ff6b6b;--warn:#f0a63a;--soft:#1f242d;--line:#5b9bff;--safe:#f0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;font-feature-settings:"tnum" 1;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.w{max-width:760px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}.sub{color:var(--mu);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;gap:6px;margin:4px 0 10px}.tabs button{flex:1;padding:10px 4px;font-size:14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chips button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:18px 2px 8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-weight:800;font-size:16px}.nm{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mu);margin-right:4px;vertical-align:1px}
.long{background:rgba(19,137,74,.14);color:var(--gd)}.short{background:rgba(201,59,59,.14);color:var(--bad)}
.ap{background:rgba(27,110,243,.14);color:var(--ac)}.new{background:var(--ac);color:#fff}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}.gr div{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:14px;font-weight:600}
.gr small{display:block;color:var(--mu);font-size:11px;font-weight:500}
.st{font-size:13px;font-weight:600}.ok{color:var(--gd)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mu{color:var(--mu)}
.note{font-size:12.5px;color:var(--mu);margin-top:6px}
.ck{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mu);margin-top:6px}.ck b{font-weight:600}
.chart{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:4px}.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:2px}
.cl{cursor:pointer}.cl:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.empty{color:var(--mu);text-align:center;padding:22px 10px;font-size:14px}
.bar{display:flex;gap:6px;margin:6px 0 4px}.bar input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;text-transform:uppercase}
.mk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mk span{font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:3px 4px 3px 10px;display:inline-flex;align-items:center;gap:4px}
.mk span button{border:0;background:none;color:var(--mu);font-size:15px;line-height:1;padding:0 5px}
.rules ol{padding-left:20px;margin:6px 0}.rules li{margin:6px 0}.rules p{margin:6px 0}
.err{border-color:var(--bad)}
.gi{border:2px solid var(--gd);border-radius:14px;padding:12px 13px;margin-bottom:12px;background:var(--card)}
.gi.none{border-color:var(--bd)}.gi h3{margin:0 0 4px;font-size:16px}
.tv{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}.tv a.btn{text-decoration:none;color:var(--ac)}
.tvp{width:100%;margin-top:4px;cursor:default}.tvp textarea{width:100%;font:11px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--bd);border-radius:8px;background:var(--soft);color:var(--tx);padding:6px;margin:6px 0}
.trk .big{font-size:24px;font-weight:800;margin:2px 0}.trr{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 0 2px;border-top:1px solid var(--bd);font-size:14px}
.lns{margin-top:8px;cursor:default}
.cl.sm{padding:10px 12px;margin-bottom:8px}.cl .tog{color:var(--ac);font-weight:600;margin-top:2px}.cl.sm .tog{margin:0}.mini{font-size:12.5px;margin-top:3px;color:var(--mu)}.mini b{color:var(--tx)}
.cl.sm .st{font-size:14px;margin-top:4px}.note.mini{margin-top:2px}.note.mini.warn{color:var(--warn)}
.wc{padding:10px 12px;margin-bottom:8px}.wc .wp{font-size:16px}.wl2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mu);margin-top:3px}
.wl2 i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}.wl3{font-size:12.5px;margin-top:3px}.wl3.warn{color:var(--warn)}
.tv.sm{margin-top:4px}.tv.sm>.btn{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ac);font-weight:600}.zsw{display:flex;gap:6px}.zsw .btn{flex:1}.lnr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--bd);font-size:13px}
.lnr i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}.lnr small{color:var(--mu);font-size:11px;font-weight:400}
.lnr.now{background:var(--soft);border-radius:6px;padding:5px 6px;font-weight:700}
.wl{background:var(--soft);border-radius:10px;padding:9px 10px;margin-bottom:10px;font-size:14px;line-height:1.6}
.op{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;cursor:default}
.oc{background:var(--soft);border-radius:10px;padding:9px 10px;margin-top:8px;font-size:13px}
.oc .on{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.oc .og{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:5px;color:var(--mu)}.oc .og b{color:var(--tx);font-weight:600}
.ob{margin-top:8px}
.stick{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px 2px;padding-top:max(8px,env(safe-area-inset-top))}
.stick .tabs{margin-top:0}.stick .chips{margin-bottom:8px}
.sk{height:84px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,var(--bd) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
.sk.tall{height:120px}@keyframes sh{to{background-position:-200% 0}}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--mu);font-size:13px;transition:height .15s}#ptr.on{height:36px;line-height:36px}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header>div{min-width:0}
.sp{display:inline-block;width:10px;height:10px;border:2px solid var(--mu);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;vertical-align:-1px}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:480px){.gr{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="w">
<header>
  <div><h1>Trade Finder</h1><div class="sub" id="sub">Loading…</div></div>
  <button class="btn" id="alerts" aria-pressed="false">🔔 Alerts off</button>
</header>
<div class="stick" id="stick"><div class="tabs" role="tablist">
  <button class="on" data-tab="calls" role="tab">Callouts</button>
  <button data-tab="watch" role="tab">Watch list</button>
  <button data-tab="journal" role="tab">Journal</button>
  <button data-tab="rules" role="tab">Rules</button>
</div>
<div class="chips" id="kinds"><button class="on" data-k="futures">Futures</button><button data-k="stocks">Stocks</button></div></div>
<div id="ptr" aria-hidden="true"></div>
<main id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>

<section class="c" id="mine" style="margin-top:18px">
  <form class="bar" id="add"><input id="addIn" placeholder="Add symbol, e.g. AMD or MGC" maxlength="15" autocomplete="off" aria-label="Add symbol"><button class="btn">Add</button></form>
  <div class="mk" id="mkList"></div>
  <div class="st" style="margin-top:14px">Position size</div>
  <div class="note" style="margin-top:2px">Her rule: risk 1–2% of your account on each trade. Enter yours and every callout shows how many contracts or shares to trade. Saved on this phone only.</div>
  <form class="bar" id="sizeF"><input id="acct" inputmode="decimal" placeholder="Account size, e.g. 10000" aria-label="Account size in dollars" style="text-transform:none"><input id="riskP" inputmode="decimal" placeholder="Risk %" aria-label="Risk percent per trade" style="max-width:90px;text-transform:none"><button class="btn">Save</button></form>
</section>

</div>
<script>
"use strict";
const DEF = { futures: ["MGC=F", "MCL=F"], stocks: [] }; // stocks: the server scans ~110 big names (api/scan.js)
const REFRESH = 5 * 60 * 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem("tl:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tl:" + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
let opts = {}, folds = {}, openCharts = {}, tvOpen = {}, zoomed = {}, data = null, tab = "calls", kind = ["futures", "stocks"].includes(store.get("kind", "")) ? store.get("kind", "") : "futures", loading = false, lastErr = null;
let extra = store.get("extra", []), removed = store.get("removed", []);
const $ = (id) => document.getElementById(id);
// Yahoo marks futures with "=F" (MGC=F). Show them the way brokers do (MGC); requests keep the Yahoo name.
const show = (sym) => String(sym).replace(/=F$/, "");
const FUT_ROOTS = ["MGC", "MCL", "GC", "CL", "SI", "SIL", "HG", "PL", "NG", "ES", "MES", "NQ", "MNQ", "YM", "MYM", "RTY", "M2K", "ZB", "ZN", "ZC", "ZS", "ZW"];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const when = (t) => etFmt.format(new Date(t * 1000)) + " ET";
const ago = (t) => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? m + "m ago" : m < 1440 * 2 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
const num = (x, d) => (x == null ? "—" : Number(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }));
const symbols = () => DEF.futures.concat(DEF.stocks).concat(extra).filter((s, i, a) => a.indexOf(s) === i && !removed.includes(s));
window._fresh = new Set(); // NEW tags last until the page is reloaded
const keyOf = (m, s) => m.sym + "|" + s.tf + "|" + s.setup + "|" + s.dir + "|" + s.t;

const STATUS = {
  open: ["Live: in the trade", "ok"], closed: ["Closed", "mu"],
  "too-far": ["Skip: too far from safety line", "warn"], "no-safety": ["Waiting for a safety line", "warn"],
};
const TFNAME = { "4H": "4-hour", "1H": "1-hour" };
const dateOf = (t) => new Date(t * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "America/New_York" });
// Her lines for TradingView: points to draw with the ray tool, and a Pine Script to paste into the Pine Editor.
// lines: [{ t0, p0, t1, p1, up, dashed, name }] (t in seconds). Rays to the right, green rising, red falling.
function pineScript(m, lines, extra) {
  // Drawn on the latest bar (re-made each update) so TradingView always shows them; old copies are deleted.
  // Main lines (thick): from point A to the same line on the newest candle (l.tv), so they land at today's level.
  // extra: every other trendline on the chart (thin), point A to point B: green under the lows, red over the highs.
  const d = (m.digits || 2) + 1, same = (a, b) => a.t0 === b.t0 && a.t1 === b.t1;
  const rest = (extra || []).filter((e) => !lines.some((l) => same(l, e)));
  const all = lines.map((l) => ({ ...l, main: true })).concat(rest).slice(0, 40);
  const row = (l0, i) => {
    const l = l0.tv ? { t0: l0.t0, p0: l0.p0, t1: l0.tv.t1, p1: l0.tv.p1 } : l0;
    return "    line.delete(l" + i + ")\n    l" + i + " := line.new(" + l.t0 * 1000 + ", " + Number(l.p0).toFixed(d) + ", " + l.t1 * 1000 + ", " + Number(l.p1).toFixed(d) +
      ", xloc=xloc.bar_time, extend=extend.right, color=" + (l0.up ? "#1fa463" : "#d64545") + ", width=" + (l0.main ? (l0.dashed ? 2 : 3) : 1) + (l0.dashed ? ", style=line.style_dashed" : "") + ") // " + (l0.name || (l0.up ? "Rising " : "Falling ") + (l0.tf || "") + " line");
  };
  return ["//@version=5", 'indicator("Trade Finder lines: ' + show(m.sym) + '", overlay=true, max_lines_count=50)']
    .concat(all.map((l, i) => "var line l" + i + " = na"), ["if barstate.islast"], all.map(row)).join("\n");
}
function tvBlock(m, lines, tf, key, small, extra) {
  const dt = (t) => new Date(t * 1000).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
  const shown = tvOpen[key];
  return '<div class="tv' + (small ? " sm" : "") + '">' +
    '<button class="btn" data-tvl="' + esc(key) + '" aria-expanded="' + !!shown + '">' + (shown ? "Hide lines" : "Lines for TradingView") + "</button>" +
    (shown ? '<div class="tvp"><div class="note" style="margin-top:0">Draw with the ray tool, point A then point B (New York time):</div>' +
      lines.map((l) => '<div class="note"><b style="color:' + (l.up ? "#1fa463" : "#d64545") + '">' + esc(l.name) + "</b>: A " + dt(l.t0) + " @ " + num(l.p0, m.digits) + " → B " + dt(l.t1) + " @ " + num(l.p1, m.digits) + "</div>").join("") +
      '<div class="note">Or on a computer: copy this, open TradingView\'s Pine Editor, paste it, and click "Add to chart". It draws this line (thick) and every other trendline on the chart (thin): green under the lows, red over the highs. Use the 4h chart of the same symbol.</div>' +
      '<textarea readonly rows="5" aria-label="Pine Script with the lines">' + esc(pineScript(m, lines, extra)) + '</textarea><button class="btn" data-copy="1">Copy script</button></div>' : "") +
    "</div>";
}

// "Get in now": a live callout that hasn't run more than ENTER_R past its entry and isn't through its stop.
const ENTER_R = 0.5;
// What to do: futures are bought or sold directly; stocks are traded with options (long = call, short = put).
const action = (m, s) => (m.kind === "stocks" ? (s.dir === "long" ? "BUY CALL" : "BUY PUT") : s.dir === "long" ? "BUY" : "SELL");
const ENTER_AGE = 24 * 3600; // a callout older than a day is too old to get into
const canEnter = (s) => s.status === "open" && !s.liveThrough && s.nowR != null && s.nowR <= ENTER_R && Date.now() / 1000 - s.t <= ENTER_AGE;
const signR = (r) => (r >= 0 ? "+" : "") + r.toFixed(2) + "R";

// Futures (and your added symbols) and the stock scan load separately: each shows as soon as it arrives,
// so futures don't wait for the stock scan.
let futPart = null, stockPart = null, scanning = false, newsEvents = [];

// Market hours (New York time; holidays aren't counted). Futures: Sunday 6 PM to Friday 5 PM, with a
// 5-6 PM break each weekday. Stocks: 9:30 AM to 4 PM, Monday to Friday. Returns "" when open.
const nyFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
function closedUntil(kind, d = new Date()) {
  const p = {}; nyFmt.formatToParts(d).forEach((x) => { p[x.type] = x.value; });
  const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), mins = (Number(p.hour) % 24) * 60 + Number(p.minute);
  if (kind === "futures") {
    if (wd === 6 || (wd === 0 && mins < 18 * 60) || (wd === 5 && mins >= 17 * 60)) return "Sun 6:00 PM";
    if (mins >= 17 * 60 && mins < 18 * 60) return "6:00 PM";
    return "";
  }
  if (wd >= 1 && wd <= 5 && mins >= 570 && mins < 960) return "";
  if (wd >= 1 && wd <= 5 && mins < 570) return "9:30 AM";
  if (wd >= 1 && wd <= 4) return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][wd + 1] + " 9:30 AM";
  return "Mon 9:30 AM";
}
// One short line: market closed (and when it opens) and/or big news in the next 24 hours.
function infoLine(m) {
  const parts = [], c = closedUntil(m.kind), now = Date.now() / 1000, crude = /^M?CL=F$/.test(m.sym);
  if (c) parts.push('<span title="Market closed. New York time.">Opens ' + c + "</span>");
  const ev = newsEvents.filter((e) => e.t >= now - 1800 && e.t <= now + 86400 && (!e.crude || crude));
  if (ev.length) {
    const at = ev[0].t <= now ? "just out" : new Date(ev[0].t * 1000).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
    parts.push('<span class="warn" title="Big news can blow through trendlines">⚠ ' + esc(at) + ": " + esc(ev[0].title) + (ev.length > 1 ? " +" + (ev.length - 1) : "") + "</span>");
  }
  return parts.length ? '<div class="note mini">' + parts.join(" · ") + "</div>" : "";
}
const chartTF = () => "4H"; // everything runs on the 4-hour chart (the server still supports ?tf=1H|both, unused)
function merge() {
  if (!futPart && !stockPart) return;
  const a = futPart || { markets: [] }, b = stockPart || {};
  const have = new Set((a.markets || []).map((m) => m.sym));
  data = { at: a.at || b.at || Date.now(), markets: (a.markets || []).concat((b.markets || []).filter((m) => !have.has(m.sym))),
    scanned: b.scanned, scanErr: !!stockPart && !b.markets, scanning, stockRecord: b.record || null, stockRanks: b.ranks || null };
}
async function load() {
  if (loading) return;
  loading = true; scanning = true; render();
  const mine = symbols();
  const fut = (mine.length ? fetch("/api/trades?s=" + encodeURIComponent(mine.join(",")) + "&tf=" + chartTF(), { cache: "no-store" }).then((r) => r.json()) : Promise.resolve({ markets: [], at: Date.now() }))
    .then((a) => { if (!a.markets) throw new Error(a.error || "no data"); futPart = a; lastErr = null; merge(); notifyNew(); render(); })
    .catch((e) => { if (!futPart) lastErr = e.message || "load failed"; render(); });
  const stk = fetch("/api/scan?tf=" + chartTF()).then((r) => r.json()).catch(() => ({ error: "scan failed" }))
    .then((b) => { stockPart = b; scanning = false; merge(); notifyNew(); render(); });
  const nws = fetch("/api/news").then((r) => r.json()).then((n) => { newsEvents = n.events || []; render(); }).catch(() => {});
  await Promise.all([fut, stk, nws]);
  scanning = false; loading = false; merge(); render();
}

function callouts() {
  if (!data) return [];
  const out = [];
  data.markets.forEach((m) => { if (!m.error && m.kind === kind) (m.signals || []).forEach((s) => out.push({ m, s })); });
  return out;
}

function notifyNew() {
  // seen: callout key -> first time this browser saw it. On the very first visit nothing counts as new.
  const seen = store.get("seen", null), next = {}, fresh = [], t = Date.now();
  if (seen) Object.keys(seen).forEach((k) => { if (seen[k] > t - 7 * 864e5) next[k] = seen[k]; });
  data.markets.forEach((m) => (m.signals || []).forEach((s) => {
    const k = keyOf(m, s);
    if (seen && !seen[k] && s.status === "open") fresh.push({ m, s });
    if (!next[k]) next[k] = t;
  }));
  fresh.forEach(({ m, s }) => window._fresh.add(keyOf(m, s)));
  store.set("seen", next);
  if (!fresh.length) return;
  document.title = "(" + fresh.length + ") Trade Finder";
  if (store.get("alerts", false) && "Notification" in window && Notification.permission === "granted") {
    fresh.slice(0, 3).forEach(({ m, s }) => {
      try { new Notification(action(m, s) + " " + show(m.sym) + " (" + s.setup + ")", { body: s.tf + " chart · entry " + num(s.entry, m.digits) + " · stop " + num(s.stop, m.digits) + " (trail it on the safety line)", tag: keyOf(m, s) }); } catch (e) { /* some phones only allow notifications from an installed app */ }
    });
  }
}

// 4-hour or 1-hour candles with her chains: green = rising lines under the lows, red = falling lines over the
// highs. The action line is drawn thick, the safety line dashed.
function chart(m, s) {
  const C = s.chart, B = C.bars, n = B.length, end = n - 1;
  const from = Math.max(0, Math.min(C.at - 70, end - 120));
  const view = B.slice(from);
  const lv = (ln, i) => ln.p0 + ln.slope * (i - ln.i0);
  let hi = -Infinity, lo = Infinity;
  view.forEach((b) => { hi = Math.max(hi, b[2]); lo = Math.min(lo, b[3]); });
  [s.stop, s.entry].forEach((v) => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad;
  const W = 640, H = 270, L = 4, R = 58, T = 8, Bm = 18, cw = (W - L - R) / view.length;
  const X = (i) => L + (i - from + 0.5) * cw, Y = (p) => T + ((hi - p) / (hi - lo)) * (H - T - Bm);
  const GREEN = "#1fa463", RED = "#d64545";
  let g = '<defs><clipPath id="cp"><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - Bm) + '"/></clipPath></defs><g clip-path="url(#cp)">';
  view.forEach((b, k) => {
    const i = from + k, up = b[4] >= b[1], col = up ? "var(--gd)" : "var(--bad)";
    g += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + Y(b[2]) + '" y2="' + Y(b[3]) + '" stroke="' + col + '" stroke-width="1" opacity=".75"/>';
    const y1 = Y(Math.max(b[1], b[4])), y2 = Y(Math.min(b[1], b[4]));
    g += '<rect x="' + (X(i) - cw * 0.35) + '" y="' + y1 + '" width="' + Math.max(1, cw * 0.7) + '" height="' + Math.max(1, y2 - y1) + '" fill="' + col + '" opacity=".75"/>';
  });
  const seg = (ln, a, b, col, dash, w, op) => '<line x1="' + X(a) + '" x2="' + X(b) + '" y1="' + Y(lv(ln, a)) + '" y2="' + Y(lv(ln, b)) + '" stroke="' + col + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + ' stroke-linecap="round" opacity="' + (op || 1) + '"/>';
  (C.chains || []).forEach((e) => { if (e.i1 >= from - 400) g += seg(e, Math.max(e.i0, from - 400), e.i1, e.up ? GREEN : RED, "", 1.2, 0.55); });
  const actUp = C.line && C.line.slope > 0;
  if (C.line) g += seg(C.line, Math.max(from - 400, C.line.i0), end, actUp ? GREEN : RED, "", 2.6);
  (C.tapIdx || []).filter((i) => i >= from).forEach((i) => { g += '<circle cx="' + X(i) + '" cy="' + Y(lv(C.line, i)) + '" r="4" fill="none" stroke="' + (actUp ? GREEN : RED) + '" stroke-width="2"/>'; });
  if (C.safety) g += seg(C.safety, Math.max(from - 400, C.safety.i0), end, C.safety.slope > 0 ? GREEN : RED, "6 4", 2.2);
  if (C.closedAt != null) g += '<circle cx="' + X(C.closedAt) + '" cy="' + Y(B[C.closedAt][4]) + '" r="5" fill="var(--card)" stroke="var(--tx)" stroke-width="2"/>';
  g += "</g>";
  const hl = (v, col, lab) => {
    if (v == null) return "";
    const y = Y(v);
    return '<line x1="' + X(Math.max(from, C.at)) + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="' + col + '" stroke-width="1.3" stroke-dasharray="2 3"/>' +
      '<text x="' + (W - R + 4) + '" y="' + (y + 4) + '" font-size="11" fill="' + col + '" font-weight="700">' + lab + "</text>";
  };
  g += hl(s.entry, "var(--mu)", "Entry") + hl(s.stop, "var(--bad)", s.status === "open" ? "Stop now" : "Stop");
  g += '<line x1="' + X(C.at) + '" x2="' + X(C.at) + '" y1="' + T + '" y2="' + (H - Bm) + '" stroke="var(--mu)" stroke-width="1" opacity=".35"/>';
  const d0 = etFmt.format(new Date(view[0][0] * 1000)).split(",").slice(0, 2).join(","), d1 = etFmt.format(new Date(view[view.length - 1][0] * 1000)).split(",").slice(0, 2).join(",");
  g += '<text x="' + L + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)">' + esc(d0) + '</text><text x="' + (W - R) + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)" text-anchor="end">' + esc(d1) + "</text>";
  return '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + TFNAME[s.tf] + " chart of " + esc(show(m.sym)) + ' with the trendlines">' + g + "</svg>" +
    '<div class="lg"><span><i style="background:#1fa463"></i>Rising lines</span><span><i style="background:#d64545"></i>Falling lines</span><span>Thick = action line (circles = taps)</span>' + (C.safety ? "<span>Dashed = safety line</span>" : "") + (C.closedAt != null ? "<span>○ = exit</span>" : "") + "<span>" + TFNAME[s.tf] + " candles</span></div></div>";
}

const TFSHORT = { Monthly: "M", Weekly: "W", Daily: "D", "4-hour": "4H", "1-hour": "1H" };
// Zoomed views with the lines drawn as rays (her ray tool), labeled by the chart each comes from.
// "mid": about 3 months of 4-hour candles with the Daily and 4-hour lines (and 1-hour ones on a 1-hour callout).
// "zoom": about 2 years of daily candles with every line.
function lineView(m, s, mode) {
  const C = s.chart, V = mode === "mid" ? C.mid : { bars: C.zoom || [], X0: 0, dX: 1 };
  const B = (V && V.bars) || [], n = B.length;
  if (!n) return "";
  const want = mode === "mid" ? ["Daily", "4-hour"].concat(s.tf === "1H" ? ["1-hour"] : []) : null;
  const lines = (C.lines || []).filter((l) => !want || want.includes(l.tf) || l.action || l.safety);
  let hi = -Infinity, lo = Infinity;
  B.forEach((b) => { hi = Math.max(hi, b[2]); lo = Math.min(lo, b[3]); });
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad;
  const W = 640, H = 300, L = 4, R = 64, T = 8, Bm = 18, Xa = V.X0, Xb = V.X0 + (n + 3) * V.dX;
  const X = (x) => L + ((x - Xa) / (Xb - Xa)) * (W - L - R), Y = (p) => T + ((hi - p) / (hi - lo)) * (H - T - Bm);
  const GREEN = "#1fa463", RED = "#d64545", cw = (W - L - R) / (n + 4);
  let g = '<defs><clipPath id="zc' + mode + '"><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - Bm) + '"/></clipPath></defs><g clip-path="url(#zc' + mode + ')">';
  B.forEach((b, i) => {
    const x = X(V.X0 + (i + 0.5) * V.dX), col = b[4] >= b[1] ? "var(--gd)" : "var(--bad)";
    g += '<line x1="' + x + '" x2="' + x + '" y1="' + Y(b[2]) + '" y2="' + Y(b[3]) + '" stroke="' + col + '" stroke-width="1" opacity=".6"/>';
    if (mode === "mid") { const y1 = Y(Math.max(b[1], b[4])), y2 = Y(Math.min(b[1], b[4])); g += '<rect x="' + (x - cw * 0.3) + '" y="' + y1 + '" width="' + Math.max(1, cw * 0.6) + '" height="' + Math.max(1, y2 - y1) + '" fill="' + col + '" opacity=".6"/>'; }
  });
  const lab = [];
  lines.forEach((l) => {
    const a = Math.max(l.X0, Xa - 2 * V.dX), v = (x) => l.P0 + l.slopeX * (x - l.X0), col = l.up ? GREEN : RED;
    g += '<line x1="' + X(a) + '" x2="' + X(Xb) + '" y1="' + Y(v(a)) + '" y2="' + Y(v(Xb)) + '" stroke="' + col + '" stroke-width="' + (l.action ? 2.8 : 1.6) + '"' + (l.safety ? ' stroke-dasharray="6 4"' : "") + ' stroke-linecap="round"/>';
    const y = Y(v(Xb));
    if (y > T && y < H - Bm) lab.push({ y, t: TFSHORT[l.tf] || l.tf, col });
  });
  g += "</g>";
  lab.sort((p, q) => p.y - q.y).forEach((l, i, a) => { if (i && l.y - a[i - 1].y < 11) l.y = a[i - 1].y + 11; g += '<text x="' + (W - R + 4) + '" y="' + (l.y + 4) + '" font-size="11" font-weight="700" fill="' + l.col + '">' + l.t + "</text>"; });
  const d = (t) => new Date(t * 1000).toLocaleDateString("en-US", mode === "mid" ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" });
  g += '<text x="' + L + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)">' + d(B[0][0]) + '</text><text x="' + (W - R) + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)" text-anchor="end">' + d(B[n - 1][0]) + "</text>";
  const what = mode === "mid" ? "Daily, 4-hour" + (s.tf === "1H" ? " and 1-hour" : "") + " lines · 4-hour candles, about 3 months" : "Every line · daily candles, about 2 years";
  return '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + (mode === "mid" ? "4-hour chart, 3 months" : "Daily chart, 2 years") + " of " + esc(show(m.sym)) + ' with trendlines">' + g + "</svg>" +
    '<div class="lg"><span><i style="background:#1fa463"></i>Rising lines</span><span><i style="background:#d64545"></i>Falling lines</span><span>M W D 4H 1H = the chart each line comes from</span><span>Thick = action line, dashed = safety line</span><span>' + what + "</span></div>" +
    (lines.length ? "" : '<div class="note">No ' + (mode === "mid" ? "Daily or 4-hour" : "") + " lines on this market right now.</div>") + "</div>";
}

// Every line on this market, top to bottom, with where it sits now. Plus the zoom button.
function linesBlock(m, s, k) {

    (l.action ? ' <span class="tag ap">action</span>' : "") + (l.safety ? ' <span class="tag">safety</span>' : "") + (l.atCallout ? ' <span class="tag">at callout</span>' : "") + '<small> since ' + since(l.t0) + "</small></span><b>" + num(l.now, d) + ' <small class="' + (l.pct >= 0 ? "ok" : "bad") + '">' + (l.pct >= 0 ? "+" : "") + l.pct.toFixed(1) + "%</small></b></div>";

function checks(s) {
  const c = s.checks || {};
  const it = (ok, t) => '<span class="' + (ok ? "ok" : "warn") + '">' + (ok ? "✓" : "✗") + " " + t + "</span>";
  return '<div class="ck">' + it(c.taps, s.taps + " taps (3+)") + it(true, "6+ candles apart") + it(c.angle, s.angle + "° (under 45°)") + it(c.history, s.days + " days (3+ weeks)") + "</div>";
}

// Option contracts for live stock callouts (calls for longs, puts for shorts). Loaded when asked.
// Option price "now": the Cboe quote is 15 minutes old, but the stock price on the page is close to live.
// Move the option by how far the stock moved since (delta + gamma), never below what it's worth at expiry.
// Skipped if the two stock prices are more than 5% apart (different sessions or bad data).
function estNow(c, quotedPx, livePx) {
  if (!(quotedPx > 0) || !(livePx > 0) || c.mid == null || c.delta == null) return null;
  const dx = livePx - quotedPx;
  if (Math.abs(dx) / quotedPx > 0.05) return null;
  const intrinsic = Math.max(0, c.type === "call" ? livePx - c.strike : c.strike - livePx);
  const est = Math.max(intrinsic, c.mid + c.delta * dx + 0.5 * (c.gamma || 0) * dx * dx);
  return { est: Math.round(est * 100) / 100, dx, live: livePx, quoted: quotedPx };
}

function optionsBlock(m, s, k) {
  if (m.kind !== "stocks" || s.status !== "open" || s.stop == null) return "";
  const o = opts[k], shown = o && o.shown;
  let h = '<div class="ob"><button class="btn" data-opt="' + esc(k) + '" aria-expanded="' + !!shown + '">' + (shown ? "Hide option contract" : "Show best option contract (" + (s.dir === "long" ? "call" : "put") + ")") + "</button></div>";
  if (!shown) return h;
  h += '<div class="op">';
  if (o.loading) h += '<div class="note"><span class="sp"></span> Loading option prices…</div>';
  else if (o.error) h += '<div class="note bad">' + esc(o.error) + "</div>";
  else {
    const d = o.data, money = (x) => "$" + num(x, 2);
    if (!d.contracts.length) h += '<div class="note">' + esc(d.note) + "</div>";
    d.contracts.forEach((c, i) => {
      const exp = new Date(c.expiry + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit", timeZone: "UTC" });
      h += '<div class="oc"><div class="on"><span>' + esc(d.sym) + " " + esc(exp) + " $" + num(c.strike, c.strike % 1 ? 1 : 0) + " " + (c.type === "call" ? "Call" : "Put") + "</span>" + '<span class="tag ap">Best pick</span>' + "</div>" +
        (() => {
          const e = estNow(c, d.price, m.price);
          if (!e) return "";
          const ch = e.est - c.mid, same = Math.abs(ch) < 0.01;
          return '<div class="note" style="margin:4px 0 6px;color:var(--tx)">Estimated price now: <b>~' + money(e.est) + "</b> (~$" + num(e.est * 100, 0) + " per contract)" +
            (same ? " · stock hasn't moved since the quote" : ' <span class="' + (ch > 0 ? "ok" : "bad") + '">' + (ch > 0 ? "+" : "−") + money(Math.abs(ch)) + "</span> since the quote, stock " + money(e.quoted) + " → " + money(e.live)) + "</div>";
        })() +
        '<div class="og">' +
        "<span>Bid / Ask <b>" + money(c.bid) + " / " + money(c.ask) + "</b></span><span>Per contract <b>$" + num(c.cost, 0) + "</b></span>" +
        "<span>Volume <b>" + num(c.volume, 0) + "</b></span><span>Open interest <b>" + num(c.oi, 0) + "</b></span>" +
        "<span>Delta <b>" + num(c.delta, 2) + "</b></span><span>Theta <b>" + num(c.theta, 2) + "</b> <small>(" + (c.theta < 0 ? "−" : "") + "$" + num(Math.abs(c.theta) * 100, 0) + "/day)</small></span>" +
        "<span>Implied volatility <b>" + c.iv + "%</b></span><span>Expires in <b>" + c.dte + " days</b></span>" +
        "<span>" + (d.targetIsDefault ? "At 2R " : "At target ") + money(d.target) + ': <b class="ok">~' + money(c.atTarget) + " (+" + c.atTargetPct + "%)</b></span>" +
        "<span>At stop " + money(d.stop) + ': <b class="bad">~' + money(c.atStop) + " (" + c.atStopPct + "%)</b></span>" +
        "<span>Breakeven at expiry <b>" + money(c.breakeven) + "</b></span></div></div>";
    });
    h += '<div class="note">Bid/ask from Cboe, 15 minutes delayed. "Estimated price now" moves that price by how far the stock has moved since (using delta and gamma): usually within a few cents, less exact in fast moves or around earnings. Check the live price in your broker before buying. "At 2R" and "at stop" are estimates if the move happens soon; time decay lowers them the longer it takes. ' +
      "2R is just a yardstick (twice the stock's risk). Her exit is the safety line: get out of the option when the stock closes through it. Options aren't part of Tori's strategy. See Rules.</div>";
  }
  return h + "</div>";
}

async function loadOptions(m, s, k) {
  opts[k] = { shown: true, loading: true }; render();
  const q = new URLSearchParams({ sym: m.sym, dir: s.dir, entry: s.entry, stop: s.stop0 }); // starting stop; no target, so options use 2R
  try {
    const r = await fetch("/api/options?" + q.toString());
    const j = await r.json();
    opts[k] = j.error ? { shown: true, error: j.error } : { shown: true, data: j };
  } catch (e) { opts[k] = { shown: true, error: "Option prices didn't load. Try again in a minute." }; }
  render();
}

// Position size from her 1-2% rule: how many contracts/shares so the starting risk fits your risk budget.
function sizeLine(m, s, short) {
  const acct = store.get("acct", 0), pct = store.get("riskP", 1);
  if (!acct || s.risk == null || s.status !== "open") return "";
  const budget = (acct * pct) / 100, per = m.pointValue ? s.risk * m.pointValue : s.risk, unit = m.pointValue ? "micro contract" : "share";
  const n = Math.floor(budget / per);
  if (short) return n < 1 ? '<div class="note mini warn">Size: 1 ' + unit + " risks $" + num(per, 0) + ", more than your " + pct + "%</div>"
    : '<div class="note mini">Size: <b>' + n + " " + unit + (n > 1 ? "s" : "") + "</b> · about $" + num(n * per, 0) + " risk</div>";
  if (n < 1) return '<div class="note warn">Size: 1 ' + unit + " risks $" + num(per, 0) + ", more than your " + pct + "% ($" + num(budget, 0) + "). Skip it, or it's a high-risk setup for your account.</div>";
  return '<div class="note">Size: <b>' + n + " " + unit + (n > 1 ? "s" : "") + "</b>, risking about $" + num(n * per, 0) + " (" + pct + "% of $" + num(acct, 0) + " = $" + num(budget, 0) + ")" + (m.kind === "stocks" ? ". With options, use the dollar risk, not the share count." : "") + "</div>";
}

  if (!big) return '<article class="c cl sm" tabindex="0" data-k="' + esc(k) + '" aria-expanded="false">' +
    '<div class="top"><div style="min-width:0"><span class="sym">' + esc(show(m.sym)) + '</span> <span class="tag ' + s.dir + '">' + s.dir.toUpperCase() + '</span><span class="tag">' + esc(s.tf) + '</span><span class="tag ' + (s.grade === "A+" ? "ap" : "") + '">' + s.grade + " · " + s.passed + "/4</span>" + (isNew ? '<span class="tag new">NEW</span>' : "") + "</div>" +

    '<div class="mini">Entry <b>' + num(s.entry, d) + "</b> · Stop order <b>" + num(s.stop, d) + "</b>" + (res != null ? ' · <b class="' + (res >= 0 ? "ok" : "bad") + '">' + signR(res) + "</b>" : "") + "</div>" + sizeLine(m, s, true) + "</article>";
  return '<article class="c cl" tabindex="0" data-k="' + esc(k) + '" aria-expanded="true">' + head +
    '<div class="gr"><div><small>Entry</small>' + num(s.entry, d) + "</div><div><small>" + (open ? "Stop order now (trailing)" : "Stop order") + "</small>" + num(s.stop, d) + "</div>" +
    "<div><small>Starting risk</small>" + num(s.risk, d) + "</div><div><small>" + (open ? "Now" : s.status === "closed" ? "Result" : "—") + "</small>" +
    (res != null ? '<span class="' + (res >= 0 ? "ok" : "bad") + '">' + signR(res) + "</span>" : "—") + "</div></div>" +
    (pv && s.risk != null ? '<div class="note" style="margin:-2px 0 6px">Per micro contract: starting risk <b>' + perC(s.risk) + "</b>" + (res != null ? " · " + (open ? "now " : "result ") + '<b class="' + (res >= 0 ? "ok" : "bad") + '">' + (res >= 0 ? "+" : "−") + perC(res * s.risk) + "</b>" : "") + " ($" + pv + " per 1.00 move)</div>" : "") +
    status + infoLine(m) + sizeLine(m, s) +

    (open ? '<div class="note">Set your stop order at <b>' + num(s.stop, d) + "</b>, just past the safety line, and trail it as the line moves. Get out early if a " + TFNAME[s.tf] + " candle closes through the safety line (now at " + num(s.line, d) + ").</div>" : "") +
    (open && s.tp ? '<div class="note">Optional take-profit, her quick-win exit: <b>' + num(s.tp.price, d) + "</b> (" + signR(s.tp.r) + "), just before a level price turned at " + s.tp.touches + " times. Trailing usually lets winners run further; the track record uses trailing.</div>" : "") +
    (s.mixed ? '<div class="note warn">Mixed signal: another line on this market says the opposite on the same candle. Be careful here.</div>' : "") +
    (s.note ? '<div class="note">' + esc(s.note) + "</div>" : "") + checks(s) +
    '<div class="note">' + (s.setup === "bounce" ? "Tagged" : s.setup === "break & retest" ? "Broke, then retested," : "Broke") + " a " + lineWord + " <b>" + esc(s.lineTF) + "</b> line (from " + dateOf(s.lineFrom) + ") on the " + TFNAME[s.tf] + " chart · " + when(s.t) +
    (s.replaced ? " · replaced " + s.replaced + " older callout" + (s.replaced > 1 ? "s" : "") : "") + "</div>" +
    (!s.chart ? '<div class="note">Chart not available for this callout.</div>' : (zoomed[k] ? lineView(m, s, zoomed[k]) : chart(m, s)) + linesBlock(m, s, k) +
    tvBlock(m, [s.chart.line && { ...s.chart.line, up: s.chart.line.slope > 0, name: "Action line" }, s.chart.safety && s.setup !== "bounce" && { ...s.chart.safety, up: s.chart.safety.slope > 0, dashed: true, name: "Safety line" }].filter(Boolean), s.tf, "c" + k, false, s.chart.lines)) +
    journalBtn(m, s, k) + optionsBlock(m, s, k) + "</article>";
}

// The box at the top of Callouts: what to get into right now, for the chosen market type.
function getInBox(all) {
  const name = kind === "futures" ? "futures" : "stocks", go = all.filter(({ s }) => canEnter(s));
  if (!go.length) return '<div class="gi none"><h3>No ' + name + " entries right now</h3>" +
    '<div class="note" style="margin:0">Nothing has triggered that passes 3 of the 4 checklist rules (with 3+ taps) and is still near its entry price. Check the Watch list for lines price is close to.</div></div>';
  return ""; // trades you can get into are the cards under "Trades to get into now"
}

// Track record: the same rules replayed over the last 6 months of prices (see record() in api/_trendlines.js).
// % return = total R x 1%, i.e. risking 1% of the account per trade (her beginner rule).
function trackBox() {
  const pct = (r) => (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(1) + "%", Rs = (r, d = 1) => (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(d) + "R";
  const since = (t) => (t ? new Date(t * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "");
  let sum, rows = "", name;
  if (kind === "futures") {
    const fm = data.markets.filter((m) => m.kind === "futures" && m.record && m.record.trades);
    if (!fm.length) return "";
    sum = fm.reduce((a, m) => ({ trades: a.trades + m.record.trades, wins: a.wins + m.record.wins, totalR: a.totalR + m.record.totalR, from: Math.min(a.from, m.record.from) }), { trades: 0, wins: 0, totalR: 0, from: Infinity });
    name = "futures";
    rows = fm.map((m) => { const r = m.record; return '<div class="trr"><b>' + esc(show(m.sym)) + "</b><span>" + r.trades + " trades · " + Math.round((100 * r.wins) / r.trades) + '% wins</span><b class="' + (r.totalR >= 0 ? "ok" : "bad") + '">' + pct(r.totalR) + "</b></div>" +
      '<div class="note" style="margin:0 0 6px">Avg ' + Rs(r.avgR, 2) + " per trade · best " + Rs(r.bestR) + " · worst " + Rs(r.worstR) + " · deepest dip " + Rs(r.maxDrawdownR) + (r.openR != null ? " · open trade now " + Rs(r.openR) : "") + "</div>"; }).join("");
  } else {
    const r = data.stockRecord;
    if (!r || !r.trades) return "";
    sum = r; name = "stocks";
    const list = (l) => l.map((x) => esc(x.sym) + " " + Rs(x.totalR)).join(" · ");
    rows = '<div class="note" style="margin:0 0 4px">All ' + r.stocks + " scanned stocks added up. Avg " + Rs(r.avgR, 2) + " per trade.</div>" +
      '<div class="note" style="margin:0 0 4px"><b class="ok">Best:</b> ' + list(r.best) + '</div><div class="note" style="margin:0 0 6px"><b class="bad">Worst:</b> ' + list(r.worst) + "</div>";
  }
  const open = !!folds.track;
  // Live record: callouts saved as they were sent (phone alerts), for this chart and market type.
  const lv = ((pushInfo && pushInfo.live) || []).filter((x) => (x.view || "4H") === chartTF() && x.kind === kind);
  const lvDone = lv.filter((x) => x.status === "closed" && x.exitR != null), lvR = lvDone.reduce((a, x) => a + x.exitR, 0);
  const liveLine = lv.length ? '<div class="note" style="margin-top:4px"><b>Live record</b> since ' + since(Math.min(...lv.map((x) => x.t))) + ": " + lvDone.length + " closed · " +
    (lvDone.length ? Math.round((100 * lvDone.filter((x) => x.exitR > 0).length) / lvDone.length) + '% wins · <b class="' + (lvR >= 0 ? "ok" : "bad") + '">' + (lvR >= 0 ? "+" : "−") + Math.abs(lvR).toFixed(1) + "R</b> · " : "") + (lv.length - lvDone.length) + " open</div>" : "";
  // Wins vs losses, in plain words. Sums across the futures markets (or all scanned stocks).
  const parts = kind === "futures" ? data.markets.filter((m) => m.kind === "futures" && m.record && m.record.trades).map((m) => m.record) : [data.stockRecord];
  const add = (k) => parts.reduce((a, r) => a + (r[k] || 0), 0), nW = add("nWin"), nL = add("nLoss");
  const days = (h) => { const d = h / 24; return d < 1 ? "less than a day" : "about " + (d < 1.5 ? "1 day" : Math.round(d) + " days"); };
  const bs = {};
  parts.forEach((r) => Object.entries(r.bySetup || {}).forEach(([k, v]) => { const b = (bs[k] = bs[k] || { trades: 0, wins: 0, totalR: 0 }); b.trades += v.trades; b.wins += v.wins; b.totalR += v.totalR; }));
  const NAMES = { break: "Breaks", retest: "Break & retest", bounce: "Bounces" };
  const bySetup = Object.keys(bs).length ? '<div class="wl"><div class="st">By setup (she says to track these separately)</div>' + ["break", "retest", "bounce"].filter((k) => bs[k]).map((k) =>
    "<div>" + NAMES[k] + ": " + bs[k].trades + " trades · " + Math.round((100 * bs[k].wins) / bs[k].trades) + '% wins · <b class="' + (bs[k].totalR >= 0 ? "ok" : "bad") + '">' + Rs(bs[k].totalR) + "</b></div>").join("") + "</div>" : "";
  const sizes = nW && nL ? '<div class="wl"><div class="st">How the wins and losses look</div>' +
    "<div>Average win <b class=\"ok\">+" + (add("winSum") / nW).toFixed(1) + "R</b> · average loss <b class=\"bad\">−" + (add("lossSum") / nL).toFixed(1) + "R</b></div>" +
    "<div>Wins are <b>" + (add("winSum") / nW / (add("lossSum") / nL)).toFixed(1) + "×</b> bigger than losses</div>" +
    "<div>For every $1 lost, <b>$" + (add("winSum") / add("lossSum")).toFixed(2) + "</b> was made</div>" +
    "<div>Winners held " + days(add("winHrs") / nW) + ", losers " + days(add("lossHrs") / nL) + "</div>" +
    '<div class="note" style="margin-top:4px">R = your starting risk. If you risk $100 a trade, the average win is about $' + Math.round((100 * add("winSum")) / nW) + " and the average loss about $" + Math.round((100 * add("lossSum")) / nL) + ".</div></div>" : "";
  return '<div class="c trk"><div class="top"><div><div class="st">Track record: ' + name + ", since " + since(sum.from) + '</div><div class="big ' + (sum.totalR >= 0 ? "ok" : "bad") + '">' + pct(sum.totalR) + '</div><div class="note" style="margin-top:0">at 1% risk per trade · ' +
    sum.trades + " trades · " + Math.round((100 * sum.wins) / sum.trades) + "% wins · " + Rs(sum.totalR) + ' total</div>' + liveLine + '</div><button class="btn" data-fold="track" aria-expanded="' + open + '">' + (open ? "Less" : "Details") + "</button></div>" +
    (open ? '<div style="margin-top:8px">' + sizes + bySetup + rows + '<div class="note">How this is worked out: the same rules replayed over the last 6 months of prices. Every callout is taken whose line passes 3 of 4 checklist rules (always 3+ taps) and has at least a week of history. Callouts skipped as too far from the safety line, or with no safety line, aren\'t taken. One position per market: a newer callout replaces the one you\'re in. Otherwise you exit when the stop order just past the safety line is hit, or a candle closes through the safety line. R is profit in multiples of your starting risk, so at 1% risk per trade, +1R = +1% of the account (at 2% risk, double it). No commissions, slippage or contract rolls, and stock trades are measured on the stock, not the option. Past results don\'t promise future ones.</div></div>' : "") + "</div>";
}

function renderCalls() {
  // Only trades you can take right now: live, fired in the last day, still near entry, with a safety line and stop.
  // Everything else (older, already moved, closed, skipped, no safety line yet) only counts in the track record.
  const live = callouts().filter(({ s }) => canEnter(s));
  if (folds.live == null) folds.live = store.get("liveOpen", true); // a bar you open and close; remembered per browser
  const bar = live.length ? '<h2><button class="btn" data-fold="live" aria-expanded="' + !!folds.live + '" style="width:100%;text-align:left;text-transform:none;letter-spacing:0;font-size:13px">' +
    (folds.live ? "▾ " : "▸ ") + "Trades to get into now (" + live.length + ")</button></h2>" + (folds.live ? live.map(({ m, s }) => card(m, s)).join("") : "") : "";
  return trackBox() + getInBox(live) + bar;
}

// Stocks that respect trendlines: every scanned stock ranked by its 6-month record on this chart (3+ trades, positive).
// Each row says where the stock is now: a callout, near a line, or nothing nearby.
const RANK_SHOW = 5;
function rankBox() {
  const list = data.stockRanks || [];
  if (!list.length) return "";
  const all = !!folds.ranks, shown = all ? list : list.slice(0, RANK_SHOW);
  const where = (sym) => {
    const m = data.markets.find((q) => q.sym === sym && !q.error);
    if (!m) return '<span class="mu">No line nearby</span>';
    const s = (m.signals || []).find((x) => canEnter(x));
    if (s) return '<b class="ok">▶ Callout now: ' + action(m, s) + "</b>";
    const w = (m.watch || []).slice().sort((a, b) => a.dist - b.dist)[0];
    return w ? "<b>Near a line</b> · " + w.dist + " ATR away" : '<span class="mu">No line nearby</span>';
  };
  return '<div class="c rkb"><div class="st">Respects trendlines · last 6 months</div>' +
    '<div class="note" style="margin:2px 0 4px">The stocks that made the most following her rules, out of all ' + (data.scanned || "") + " scanned.</div>" +
    shown.map((r, i) => '<div class="trr"><span><b>' + (i + 1) + ". " + esc(r.sym) + '</b> <span class="note">' + r.trades + " trades · " + Math.round((100 * r.wins) / r.trades) + '% wins</span></span><b class="ok">+' + r.totalR.toFixed(1) + "R</b></div>" +
      '<div class="note" style="margin:0 0 4px">' + where(r.sym) + "</div>").join("") +
    (list.length > RANK_SHOW ? '<button class="btn" data-fold="ranks" style="width:100%;margin-top:6px">' + (all ? "Show top " + RANK_SHOW : "Show all " + list.length) + "</button>" : "") + "</div>";
}

// How far price is from a watch-list line: in price (stocks in $, futures in points plus $ per micro contract)
// and in ATRs (typical candle sizes on that chart).
function away(m, w) {
  const d = Math.abs(m.price - w.lineNow);
  const px = m.kind === "stocks" ? "$" + num(d, 2) : num(d, m.digits) + " pts" + (m.pointValue ? " ($" + num(d * m.pointValue, 0) + "/contract)" : "");
  return px + " away · " + w.dist + " ATR";
}

// Days until a B line becomes A+, if 3 weeks of history is the only rule it's missing and it's within a week.
function soonAplus(w) {
  const c = w.checks || {};
  if (w.grade === "A+" || !c.taps || !c.angle || c.history) return null;
  const left = 21 - w.days;
  return left >= 1 && left <= 7 ? left : null;
}

// One compact watch-list box: symbol, tags and the line's price; which line and how far; the plan; anything missing.
function watchCard(m, w) {
  const c = w.checks || {}, miss = [];
  if (!c.taps) miss.push(w.taps + " taps (3+)");
  if (!c.angle) miss.push(w.angle + "° (under 45°)");
  if (!c.history) miss.push("3+ weeks (" + w.days + " days)");
  const soon = soonAplus(w), up = w.kind.startsWith("rising");
  const plan = up ? "Close below = short · tag and hold = long" : "Close above = long · tag and reject = short";
  return '<article class="c wc"><div class="top"><div style="min-width:0"><span class="sym">' + esc(show(m.sym)) + '</span> <span class="tag">' + esc(w.tf) + '</span><span class="tag ' + (w.grade === "A+" ? "ap" : "") + '">' + w.grade + " · " + w.passed + "/4</span>" +
    (soon != null ? '<span class="tag ap">A+ in ' + soon + " day" + (soon > 1 ? "s" : "") + "</span>" : "") + '</div><b class="wp">' + num(w.lineNow, m.digits) + "</b></div>" +
    '<div class="wl2"><span><i style="background:' + (up ? "#1fa463" : "#d64545") + '"></i>' + (up ? "Rising " : "Falling ") + esc(w.lineTF) + " line</span><span>" + away(m, w) + "</span></div>" +
    '<div class="wl3">' + esc(plan) + "</div>" + infoLine(m) + (miss.length ? '<div class="wl3 warn">Missing: ' + esc(miss.join(", ")) + "</div>" : "") +
    (pushInfo && pushInfo.configured ? '<div class="tv sm"><button class="btn" data-lal="' + esc(m.sym + "|" + w.tf + "|" + w.key) + '">' + (store.get("lineAlerts", {})[m.sym + "|" + w.tf + "|" + w.key] ? "🔔 Alert set ✓" : "🔔 Alert me at this line") + "</button></div>" : "") +
    (w.line ? tvBlock(m, [{ ...w.line, name: (up ? "Rising" : "Falling") + " " + w.lineTF + " line" }], w.tf, "w" + m.sym + w.tf + w.key, true, w.all) : "") + "</article>";
}

const WATCH_SHOW = 5; // stocks watch list: cards shown before "Show all"
function renderWatch() {
  if (!data) return "";
  const rows = [];
  data.markets.forEach((m) => { if (!m.error && m.kind === kind) (m.watch || []).forEach((w) => rows.push({ m, w })); });
  // A+ first, then lines about to become A+ (only missing the 3 weeks, within a week of it), then the rest; nearest first.
  const tier = (w) => (w.grade === "A+" ? 0 : soonAplus(w) != null ? 1 : 2);
  rows.sort((a, b) => tier(a.w) - tier(b.w) || a.w.dist - b.w.dist);
  const top = kind === "stocks" ? rankBox() : ""; // stocks that respect trendlines, before anything is a callout
  if (!rows.length) return top + '<div class="c empty">No callout-quality trendlines within 1.5 ATR of price right now.</div>';
  // Stocks: show the top 5, with a button to see the rest. Futures always show everything.
  const cut = kind === "stocks" && rows.length > WATCH_SHOW, all = !!store.get("watchAll", false), shown = cut && !all ? rows.slice(0, WATCH_SHOW) : rows;
  const more = cut ? '<button class="btn" data-wall="1" aria-expanded="' + all + '" style="width:100%;margin-bottom:12px">' + (all ? "Show only the top " + WATCH_SHOW : "Show all " + rows.length) + "</button>" : "";
  return top + '<h2>Price is near a trendline (' + rows.length + ')</h2><div class="note" style="margin:-4px 2px 8px">Lines that would make a real callout if price breaks or bounces off them. Set alerts on these.</div>' +
    shown.map(({ m, w }) => watchCard(m, w)).join("") + more;
}

// Journal (her rule: journal every trade), saved on this phone. Each entry: the callout as you took it, and
// your exit when you close it.
const jGet = () => store.get("journal", []), jSet = (j) => store.set("journal", j);
const SETUP_KIND = (setup) => (setup === "bounce" ? "Bounces" : setup === "break & retest" ? "Break & retest" : "Breaks");
function journalBtn(m, s, k) {
  const inJ = jGet().some((x) => x.key === k);
  return '<div class="ob"><button class="btn' + (inJ ? " on" : "") + '" data-took="' + esc(k) + '"' + (inJ ? " disabled" : "") + ">" + (inJ ? "In your journal ✓" : "I took this trade") + "</button></div>";
}
function took(k) {
  if (!data) return;
  data.markets.forEach((m) => (m.signals || []).forEach((s) => {
    if (keyOf(m, s) !== k || jGet().some((x) => x.key === k)) return;
    const j = jGet();
    j.unshift({ key: k, sym: m.sym, kind: m.kind, digits: m.digits, pv: m.pointValue || null, dir: s.dir, tf: s.tf, setup: s.setup, grade: s.grade,
      entry: s.entry, stop: s.stop0, risk: s.risk, t: s.t, at: Date.now(), size: null, exit: null, closedAt: null });
    jSet(j);
  }));
}
function renderJournal() {
  const j = jGet(), R = (x) => (x.exit == null ? null : ((x.dir === "long" ? 1 : -1) * (x.exit - x.entry)) / x.risk);
  if (!j.length) return '<div class="c empty">No trades yet. Open a callout and tap <b>I took this trade</b> to start your journal.</div>';
  const done = j.filter((x) => x.exit != null), rs = done.map(R), tot = rs.reduce((a, r) => a + r, 0);
  const by = {};
  done.forEach((x, i) => { const k = SETUP_KIND(x.setup), b = (by[k] = by[k] || { n: 0, w: 0, r: 0 }); b.n++; if (rs[i] > 0) b.w++; b.r += rs[i]; });
  const head = '<div class="c trk"><div class="st">Your journal</div>' + (done.length
    ? '<div class="big ' + (tot >= 0 ? "ok" : "bad") + '">' + (tot >= 0 ? "+" : "−") + Math.abs(tot).toFixed(1) + 'R</div><div class="note" style="margin-top:0">' + done.length + " closed trade" + (done.length > 1 ? "s" : "") + " · " + Math.round((100 * rs.filter((r) => r > 0).length) / done.length) + "% wins · " + (j.length - done.length) + " open</div>" +
      '<div class="wl" style="margin-top:8px"><div class="st">By setup</div>' + Object.keys(by).map((k) => "<div>" + k + ": " + by[k].n + " · " + Math.round((100 * by[k].w) / by[k].n) + '% wins · <b class="' + (by[k].r >= 0 ? "ok" : "bad") + '">' + (by[k].r >= 0 ? "+" : "−") + Math.abs(by[k].r).toFixed(1) + "R</b></div>").join("") + "</div>"
    : '<div class="note">' + j.length + " open trade" + (j.length > 1 ? "s" : "") + ". Enter your exit price when you close one.</div>") + "</div>";
  return head + j.map((x, i) => {
    const r = R(x), d = x.digits || 2, money = x.pv && r != null ? " · " + (r >= 0 ? "+" : "−") + "$" + num(Math.abs(r * x.risk * x.pv), 0) + " per contract" : "";
    return '<article class="c wc"><div class="top"><div><span class="sym">' + esc(show(x.sym)) + '</span> <span class="tag ' + x.dir + '">' + x.dir.toUpperCase() + '</span><span class="tag">' + esc(x.tf) + '</span><span class="tag">' + esc(x.setup) + '</span><span class="tag">' + esc(x.grade) + "</span></div>" +
      (r != null ? '<b class="' + (r >= 0 ? "ok" : "bad") + '">' + (r >= 0 ? "+" : "") + r.toFixed(2) + "R</b>" : '<span class="tag">open</span>') + "</div>" +
      '<div class="wl2"><span>Entry ' + num(x.entry, d) + " · stop " + num(x.stop, d) + "</span><span>" + new Date(x.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) + "</span></div>" +
      (x.exit != null ? '<div class="wl3">Exit ' + num(x.exit, d) + money + "</div>"
        : '<form class="bar jx" data-ji="' + i + '"><input inputmode="decimal" placeholder="Exit price" aria-label="Exit price" style="text-transform:none"><button class="btn">Close trade</button></form>') +
      '<button class="btn jdel" data-jdel="' + i + '" style="border:0;background:none;padding:2px 0;font-size:12px;color:var(--mu)">Remove</button></article>';
  }).join("");
}

function renderRules() {
  const A = ' <span class="tag ok">automatic</span>', Y = ' <span class="tag">you</span>';
  return '<div class="c rules"><div class="st">Her system, step by step</div><ol>' +
    "<li><b>Top-down analysis</b>" + A + ". Start on the <b>monthly</b> chart. The first rising line starts at the <b>lowest point</b>, angled up, never flat. Each next line starts where the last one ended (\"previous point B is new point A\"), catches as many touches as possible, and price can't have poked through it, wicks included. Falling lines start the same way from the <b>highest point</b>. Then step down through weekly, daily, 4-hour and 1-hour, nudging lines and adding steeper ones near price. Green = rising, red = falling.</li>" +
    "<li><b>Wait for price to come to you</b>" + Y + ". She sets an alert on her lines and walks away. Use the Watch list levels for your alerts. Trade Finder's alerts tell you when a callout fires.</li>" +
    "<li><b>Pick the setup</b>" + A + " (she calls them playbooks):<br><b>Trend line break</b>, her core setup: a candle <i>closes</i> through the newest line, and you trade the direction of the break. Breaking a rising line = short, breaking a falling line = long.<br><b>Break &amp; retest</b>: price breaks the line, pulls back and touches it from the other side, and that candle closes still respecting it. Then enter.<br><b>Bounce</b>: price tags the line and holds. That line is both the action and safety line.</li>" +
    "<li><b>Safety line and stop</b>" + A + ": the safety line is the newest line of the other color. The stop order goes <b>just past</b> it, never on it. If the safety line is far away, it's a high-risk setup: skip it.</li>" +
    "<li><b>Position size</b>" + A + " once you enter your account size below: risk <b>1–2%</b> of your account per trade. Use micros if a mini is too big.</li>" +
    "<li><b>Manage the trade</b>" + A + ": trail the stop along the safety line each time price makes a new swing. Some brokers do this for you, others need it done by hand.</li>" +
    "<li><b>Exit</b>" + A + ": a candle <b>closes</b> through the safety line (a quick poke isn't enough), or the stop order is hit. Optional: take profit at a nearby support/resistance level price has turned at several times, set just before it. That's shown on live cards. Backtest which exit suits you.</li>" +
    "<li><b>Grade it</b>" + A + " (her checklist): 3+ taps, 6+ candles apart, under 45° with 3 months on screen, 3+ weeks from first tap to the break. A+ = all 4. Your filter: at least 3 of 4, always with 3+ taps, and at least 1 week of history (her playbook minimum).</li>" +
    "<li><b>Redraw daily</b>" + A + ": after price breaks a line, move point B to the new high or low so nothing pokes through. Trade Finder redraws every scan.</li>" +
    "<li><b>Commit to one timeframe</b>" + A + ": she picks one chart for entries and exits and doesn't jump between them. Trade Finder uses the 4-hour chart unless you change it under Chart at the bottom of the Callouts tab.</li>" +
    "<li><b>Journal every trade</b>" + Y + " and tag the setup: break, break &amp; retest, or bounce. Compare them after 30–50 trades. Only size up when your numbers show you're consistent. Tap <b>I took this trade</b> on a callout and it goes in the Journal tab, split by setup.</li>" +
    "<li><b>Practice first</b>" + Y + ": paper trade with a realistic account size until it's consistent.</li></ol>" +
    '</div>';
}

const PULL = 90; // pixels to pull down before a refresh
const SKELETON = '<div class="sk tall"></div><div class="sk"></div><div class="sk"></div>';
function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll("#kinds button").forEach((b) => b.classList.toggle("on", b.dataset.k === kind));
  $("kinds").style.display = tab === "rules" ? "none" : "";
  $("mine").style.display = tab === "calls" || tab === "watch" ? "" : "none"; // settings only under Callouts and Watch list
  const sub = $("sub");
  if (data) {
    const bad = data.markets.filter((m) => m.error);
    sub.innerHTML = "Updated " + esc(new Date(data.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })) + (loading ? ' <span class="sp"></span>' : "") +
      (data.scanning ? " · scanning stocks…" : data.scanned ? " · scanned " + data.scanned + " stocks" : data.scanErr ? ' · <span class="warn">stock scan failed</span>' : "") +
      (bad.length ? ' · <span class="warn">no data for ' + esc(bad.map((m) => show(m.sym)).join(", ")) + "</span>" : "") + (lastErr ? ' · <span class="bad">refresh failed</span>' : "");
  } else if (lastErr) sub.innerHTML = '<span class="bad">Could not load prices (' + esc(lastErr) + ").</span> Retrying in 5 minutes.";
  const out = $("out");
  $("kinds").style.display = tab === "rules" || tab === "journal" ? "none" : "";
  if (tab === "rules") out.innerHTML = renderRules();
  else if (tab === "journal") out.innerHTML = renderJournal();
  else if (!data) out.innerHTML = lastErr ? '<div class="c err empty">Prices didn\'t load. <button class="btn" id="retry">Try again</button></div>' : SKELETON;
  else {
    // While the stock scan runs: a note on the Stocks tab, and placeholders if no stocks are showing yet.
    const wait = kind === "stocks" && data.scanning ? '<div class="note" style="margin:0 2px 8px">Scanning about 110 stocks… the first scan can take up to 30 seconds.</div>' : "";
    out.innerHTML = wait && !data.markets.some((m) => m.kind === "stocks") ? wait + SKELETON : wait + (tab === "calls" ? renderCalls() : renderWatch());
  }
  const al = store.get("alerts", false);
  $("alerts").textContent = al ? (store.get("push", false) ? "🔔 Phone alerts on" : "🔔 Alerts on") : "🔔 Alerts off";
  $("alerts").classList.toggle("on", al); $("alerts").setAttribute("aria-pressed", String(al));
  $("mkList").innerHTML = symbols().map((s) => "<span>" + esc(show(s)) + '<button data-rm="' + esc(s) + '" aria-label="Remove ' + esc(show(s)) + '">×</button></span>').join("") +
    (removed.length ? '<span style="padding-right:10px"><button data-reset="1" style="color:var(--ac);font-size:12px;padding:0">Restore defaults</button></span>' : "");
}

document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return; // links open normally and don't toggle the chart
  const t = e.target.closest("[data-tab],[data-k],[data-rm],[data-reset],[data-fold],[data-opt],[data-tvl],[data-copy],[data-zoom],[data-wall],[data-took],[data-jdel],[data-lal],.op,.tvp,.lns,#retry,.cl,#alerts");
  if (!t || t.classList.contains("op")) return;
  if (t.dataset.lal) {
    const [sym, tf2, ...rest] = t.dataset.lal.split("|"), key = rest.join("|");
    data.markets.forEach((m) => { if (m.sym === sym) (m.watch || []).forEach((w) => { if (w.tf === tf2 && w.key === key) lineAlert(m, w); }); });
    return;
  }
  if (t.dataset.took) { took(t.dataset.took); render(); return; }
  if (t.dataset.jdel != null) { if (confirm("Remove this trade from your journal?")) { const j = jGet(); j.splice(Number(t.dataset.jdel), 1); jSet(j); render(); } return; }
  if (t.dataset.wall) { store.set("watchAll", !store.get("watchAll", false)); render(); return; }
  if (t.dataset.zoom) { zoomed[t.dataset.zoom] = t.dataset.mode || ""; render(); return; }
  if (t.classList.contains("lns")) return;
  if (t.dataset.tvl) { tvOpen[t.dataset.tvl] = !tvOpen[t.dataset.tvl]; render(); return; }
  if (t.dataset.copy) {
    const ta = t.parentNode.querySelector("textarea");
    const done = () => { t.textContent = "Copied ✓"; };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); });
    else { ta.select(); try { document.execCommand("copy"); done(); } catch (er) { /* select it at least */ } }
    return;
  }
  if (t.classList.contains("tvp")) return;
  if (t.dataset.opt) {
    const k = t.dataset.opt, o = opts[k];
    if (o && (o.data || o.loading)) { o.shown = !o.shown; render(); return; } // a failed load retries
    data.markets.forEach((m) => (m.signals || []).forEach((s) => { if (keyOf(m, s) === k) loadOptions(m, s, k); }));
    return;
  }
  if (t.dataset.fold) { folds[t.dataset.fold] = !folds[t.dataset.fold]; if (t.dataset.fold === "live") store.set("liveOpen", folds.live); render(); }
  else if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.k && t.closest("#kinds")) { kind = t.dataset.k; store.set("kind", kind); render(); }
  else if (t.dataset.rm) { const s = t.dataset.rm; extra = extra.filter((x) => x !== s); if (!removed.includes(s) && (DEF.futures.includes(s) || DEF.stocks.includes(s))) removed.push(s); store.set("extra", extra); store.set("removed", removed); render(); load(); }
  else if (t.dataset.reset) { removed = []; store.set("removed", removed); render(); load(); }
  else if (t.id === "retry") load();
  else if (t.id === "alerts") toggleAlerts();
  else if (t.classList.contains("cl")) {
    if (t.getAttribute("aria-expanded") === "true" && e.target.closest(".chart") && !e.target.closest(".top")) return; // tapping the chart keeps it open
    const k = t.dataset.k; openCharts[k] = !openCharts[k]; render();
  }
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("cl")) { e.preventDefault(); e.target.click(); } });
(() => {
  let y0 = null, dy = 0;
  const ptr = $("ptr");
  addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 20) { ptr.classList.add("on"); ptr.textContent = dy > PULL ? "Release to refresh" : "Pull to refresh"; }
  }, { passive: true });
  addEventListener("touchend", () => {
    if (y0 != null && dy > PULL && !loading) { ptr.textContent = "Refreshing…"; load().then(() => ptr.classList.remove("on")); }
    else ptr.classList.remove("on");
    y0 = null; dy = 0;
  });
})();
document.addEventListener("submit", (e) => {
  const f = e.target.closest(".jx");
  if (!f) return;
  e.preventDefault();
  const v = parseFloat(String(f.querySelector("input").value).replace(/[$,]/g, ""));
  if (!(v > 0)) return;
  const j = jGet(), x = j[Number(f.dataset.ji)];
  if (x) { x.exit = v; x.closedAt = Date.now(); jSet(j); render(); }
});
$("sizeF").addEventListener("submit", (e) => {
  e.preventDefault();
  const a = parseFloat(String($("acct").value).replace(/[$,]/g, "")), p = parseFloat($("riskP").value);
  if (a > 0) store.set("acct", a);
  if (p > 0 && p <= 10) store.set("riskP", p);
  render();
});
(() => { const a = store.get("acct", 0), p = store.get("riskP", 0); if (a) $("acct").value = a; if (p) $("riskP").value = p; })();
$("add").addEventListener("submit", (e) => {
  e.preventDefault();
  let s = $("addIn").value.trim().toUpperCase();
  if (FUT_ROOTS.includes(s)) s += "=F"; // typing MGC means the futures contract
  if (!/^[A-Z0-9^][A-Z0-9.=^-]{0,14}$/.test(s)) return;
  removed = removed.filter((x) => x !== s); if (!symbols().includes(s)) extra.push(s);
  store.set("extra", extra); store.set("removed", removed); $("addIn").value = ""; render(); load();
});

// Alerts: phone alerts (Web Push) when the site's database is set up - they arrive even when the site is closed.
// Otherwise (or if the phone can't), alerts only work while the page is open.
let pushInfo = null; // GET /api/push: { configured, publicKey, live }
async function pushSub() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
const post = (body) => fetch("/api/push", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const b64ToBytes = (b) => { const s2 = atob((b + "===".slice((b.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s2, (c) => c.charCodeAt(0)); };
async function toggleAlerts() {
  const on = !store.get("alerts", false);
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent), installed = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (on && pushInfo && pushInfo.configured && iOS && !installed) {
    alert("To get alerts on your iPhone, add Trade Finder to your Home Screen first (Share → Add to Home Screen), open it from there, then tap 🔔 again.");
    return;
  }
  if (on && "Notification" in window && Notification.permission !== "granted") {
    let p = "denied";
    try { p = await Notification.requestPermission(); } catch (e) { /* old Safari */ }
    if (p !== "granted") { alert("Notifications are blocked for this site. Turn them on in your phone's settings, then try again."); return; }
  }
  if (pushInfo && pushInfo.configured && "PushManager" in window) {
    try {
      if (on) {
        const reg = await navigator.serviceWorker.ready;
        const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(pushInfo.publicKey) }));
        await post({ action: "subscribe", sub: sub.toJSON(), prefs: { tf: chartTF() } });
        store.set("push", true);
        post({ action: "test", endpoint: sub.endpoint }).catch(() => {});
      } else {
        const sub = await pushSub();
        if (sub) { await post({ action: "unsubscribe", endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
        store.set("push", false); store.set("lineAlerts", {});
      }
    } catch (e) { alert("Phone alerts couldn't be turned on (" + (e.message || "error") + "). Alerts will still work while this page is open."); store.set("push", false); }
  }
  store.set("alerts", on); render();
}
// Watch-list "Alert me": tell me when price reaches this line.
async function lineAlert(m, w) {
  const id = m.sym + "|" + w.tf + "|" + w.key, mine = store.get("lineAlerts", {}), sub = store.get("push", false) ? await pushSub() : null;
  if (!sub) { alert("Turn on 🔔 Alerts at the top first (phone alerts)."); return; }
  if (mine[id]) { await post({ action: "unalert", endpoint: sub.endpoint, id }).catch(() => {}); delete mine[id]; }
  else {
    const r = await post({ action: "alert", endpoint: sub.endpoint, alert: { id, sym: m.sym, tf: w.tf, key: w.key, level: w.lineNow, dir: w.kind.startsWith("rising") ? "below" : "above", label: (w.kind.startsWith("rising") ? "Rising " : "Falling ") + w.lineTF + " line" } }).catch(() => ({}));
    if (!r.ok) { alert(r.error || "The alert couldn't be saved. Try again."); return; }
    mine[id] = Date.now();
  }
  store.set("lineAlerts", mine); render();
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) { document.title = "Trade Finder"; if (!data || Date.now() - data.at > REFRESH) load(); } });
setInterval(() => { if (!document.hidden) load(); }, REFRESH);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
fetch("/api/push").then((r) => r.json()).then((j) => {
  pushInfo = j; render();
  // Phones that picked 1-hour or Both before: back to the 4-hour chart, alerts included.
  if (store.get("tf", "4H") !== "4H") { store.set("tf", "4H"); if (store.get("push", false)) pushSub().then((sub) => sub && post({ action: "subscribe", sub: sub.toJSON(), prefs: { tf: "4H" } })).catch(() => {}); }
}).catch(() => {});
render(); load();
</script>
