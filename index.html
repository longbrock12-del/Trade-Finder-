<style>
:root{color-scheme:dark;--bg:#0b0f0e;--card:#131a18;--tx:#dde8e3;--mu:#839690;--bd:#24302c;--ac:#34d399;--on:#04140c;--gd:#34d399;--bad:#f26b6b;--warn:#e7a93b;--soft:#1a2320;--line:#e7a93b;--safe:#e7a93b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "IBM Plex Sans",Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;font-feature-settings:"tnum" 1;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}.sub{color:var(--mu);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}

.fd{border-top:1px solid var(--bd);margin-top:6px}.fh{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:9px 2px;font-size:13px;font-weight:600;color:var(--tx);cursor:pointer}.fb{padding-bottom:6px}.fb .note.srn,.fb .note{margin-top:0}

.tv.sm{margin-top:4px}.tv.sm>.btn{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ac);font-weight:600}.zsw{display:flex;gap:6px}.zsw .btn{flex:1}.lnr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--bd);font-size:13px}

.lnr.now{background:var(--soft);border-radius:6px;padding:5px 6px;font-weight:700}
.wl{background:var(--soft);border-radius:10px;padding:9px 10px;margin-bottom:10px;font-size:14px;line-height:1.6}
.op{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;cursor:default}
.oc{background:var(--soft);border-radius:10px;padding:9px 10px;margin-top:8px;font-size:13px}
.oc .on{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.oc .og{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:5px;color:var(--mu)}.oc .og b{color:var(--tx);font-weight:600}
.ob{margin-top:8px}
.stick{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:8px 16px 2px;padding-top:max(8px,env(safe-area-inset-top))}
.stick .tabs{margin-top:0}.stick .chips{margin-bottom:8px}
.sk{height:84px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,var(--bd) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}

#ptr{height:0;overflow:hidden;text-align:center;color:var(--mu);font-size:13px;transition:height .15s}#ptr.on{height:36px;line-height:36px}
.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header>div{min-width:0}
.sp{display:inline-block;width:10px;height:10px;border:2px solid var(--mu);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;vertical-align:-1px}

@media (max-width:480px){.gr{grid-template-columns:repeat(2,1fr)}}

/* Look: terminal colors (black, amber, green, monospace numbers) with soft floating boxes */
h1{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:19px;color:var(--gd);text-transform:uppercase;letter-spacing:.08em}

.btn{border:0;background:var(--soft);border-radius:10px}

.bar input{border:0;background:var(--soft)}.bar select{flex:1;min-width:0;border:0;background:var(--soft);color:var(--tx);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.gr div,.oc,.wl,.lnr.now{border-radius:12px}
.sym,.wp,.big,.gr div,.mini b,.trr b{font-family:"JetBrains Mono",ui-monospace,monospace}
.trk .big{font-size:28px}
.gi{box-shadow:0 0 0 1.5px var(--gd),0 10px 30px rgba(47,212,122,.08)}.gi.none{box-shadow:0 10px 30px rgba(0,0,0,.45)}
h2{color:var(--ac);font-family:"JetBrains Mono",monospace}
.ap{background:rgba(224,162,42,.14);color:var(--ac)}.new{background:var(--ac);color:#120c00}
input::placeholder{color:#55665c}
.tag.tok{background:rgba(47,212,122,.14);color:var(--gd)}.tag.tnear{background:rgba(224,162,42,.14);color:var(--warn)}
.cau{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mtop{display:flex;justify-content:space-between;font-size:12px;font-family:"JetBrains Mono",monospace}.mpx{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nbar{height:4px;border-radius:3px;background:var(--soft);margin:5px 0 2px;overflow:hidden}.nbar i{display:block;height:100%;border-radius:3px}

.rtr{padding:4px 12px}.rtr .note.mini{margin-bottom:6px}.rtog{display:block;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:8px 0}

.ohead{padding:8px 0 4px;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.omore{width:100%;border:0;background:none;color:var(--ac);padding:6px 0 0;text-align:left;font-size:12.5px}
.cd{margin-left:auto;align-self:center;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mu);white-space:nowrap}.cd b{color:var(--ac);font-weight:700}
.tag.tbad{background:rgba(240,86,90,.14);color:var(--bad)}

/* Tidier layout: one look for section titles, quieter footnotes, settings tucked away. */
.ohead,h2 .btn[data-fold=live]{font-family:"IBM Plex Sans",Inter,-apple-system,system-ui,sans-serif!important;font-size:14px!important;font-weight:700;color:var(--tx)!important;letter-spacing:0;text-transform:none}

/* Palette A (graphite + mint): one accent for buttons and tabs; green/red = money and direction; amber = warnings and S/R. */
.tabs button.on,.btn.on,.chips button.on{background:var(--ac)!important;color:var(--on)!important;border-color:transparent!important;box-shadow:0 4px 14px rgba(52,211,153,.22)!important}
h2{color:var(--mu)}.ohead,.setsum{color:var(--tx)}.stick{background:var(--bg)}
.note.stn{background:rgba(52,211,153,.08)}

.golive,#out>.golive{border-color:transparent!important;animation:glow 2.6s ease-in-out infinite}#out.anim>.golive,#out.anim .golive{animation:rise .35s ease-out both,glow 2.6s ease-in-out .35s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}80%,100%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}

<body><div class="w">
<header>
  <div><h1>Trade Finder</h1><div class="sub" id="sub">Loading…</div></div>
  <button class="btn" id="alerts" aria-pressed="false">🔔 Alerts off</button>
</header>
<div class="stick" id="stick"><div class="tabs" role="tablist">
  <button class="on" data-tab="calls" role="tab">Callouts</button>
  <button data-tab="watch" role="tab">Watch list</button>
  <button data-tab="rules" role="tab">Rules</button>
</div>
<div class="chips" id="kinds"><button class="on" data-k="futures">Futures</button><button data-k="stocks">Stocks</button><span id="cd" class="cd" title="New York market hours"></span></div></div>
<div id="ptr" aria-hidden="true"></div>
<main id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>

<details class="c" id="mine" style="margin-top:18px"><summary class="setsum">⚙ My symbols &amp; position size</summary>
  <form class="bar" id="add"><input id="addIn" placeholder="Add symbol, e.g. AMD or MGC" maxlength="15" autocomplete="off" aria-label="Add symbol"><button class="btn">Add</button></form>
  <div class="mk" id="mkList"></div>
  <div class="st" style="margin-top:14px">Position size</div>
  <div class="note" style="margin-top:2px">Her rule: risk 1–2% of your account on each trade. Enter yours and every callout shows how many contracts or shares to trade. Saved on this phone only.</div>
  <form class="bar" id="sizeF"><input id="acct" inputmode="decimal" placeholder="Account size, e.g. 10000" aria-label="Account size in dollars" style="text-transform:none"><input id="riskP" inputmode="decimal" placeholder="Risk %" aria-label="Risk percent per trade" style="max-width:90px;text-transform:none"><button class="btn">Save</button></form>
</details>

</div>
<script>
"use strict";
const DEF = { futures: ["MGC=F", "MCL=F", "MHG=F"], stocks: [] }; // stocks: the server scans ~110 big names (api/scan.js)
const REFRESH = 5 * 60 * 1000;
const store = {
  get(k, d) { try { const v = localStorage.getItem("tl:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tl:" + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
let opts = {}, folds = {}, openCharts = {}, wcharts = {}, looked = null, zoomed = {}, data = null, tab = "calls", kind = ["futures", "stocks"].includes(store.get("kind", "")) ? store.get("kind", "") : "futures", loading = false, lastErr = null;
let extra = store.get("extra", []), removed = store.get("removed", []);
const $ = (id) => document.getElementById(id);
// Yahoo marks futures with "=F" (MGC=F). Show them the way brokers do (MGC); requests keep the Yahoo name.
const show = (sym) => String(sym).replace(/=F$/, "");
const FUT_ROOTS = ["MGC", "MCL", "GC", "CL", "SI", "SIL", "HG", "MHG", "PL", "NG", "ES", "MES", "NQ", "MNQ", "YM", "MYM", "RTY", "M2K", "ZB", "ZN", "ZC", "ZS", "ZW"];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const etFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const when = (t) => etFmt.format(new Date(t * 1000)) + " ET";
// The entry candle, by the time it opened (how TradingView labels candles): "Mon, Nov 9, 4:00 PM 4H candle".
const entryCandle = (t, tf) => '<small class="sub">' + etFmt.format(new Date(t * 1000)) + " " + esc(tf || "4H") + " candle</small>";
const ago = (t) => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? m + "m ago" : m < 1440 * 2 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };

// "Get in now": a live callout that hasn't run more than ENTER_R past its entry and isn't through its stop.
const ENTER_R = 0.5;

// Market hours (New York time; holidays aren't counted). Futures: Sunday 6 PM to Friday 5 PM, with a
// 5-6 PM break each weekday. Stocks: 9:30 AM to 4 PM, Monday to Friday. Returns "" when open.
const nyFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
function closedUntil(kind, d = new Date()) {
  const p = {}; nyFmt.formatToParts(d).forEach((x) => { p[x.type] = x.value; });
  const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday), mins = (Number(p.hour) % 24) * 60 + Number(p.minute);
  if (kind === "futures") {
    if (wd === 6 || (wd === 0 && mins < 18 * 60) || (wd === 5 && mins >= 17 * 60)) return "Sun 6:00 PM";
    if (mins >= 17 * 60 && mins < 18 * 60) return "6:00 PM";
    return "";
  }
  if (wd >= 1 && wd <= 5 && mins >= 570 && mins < 960) return "";
  if (wd >= 1 && wd <= 5 && mins < 570) return "9:30 AM";
  if (wd >= 1 && wd <= 4) return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][wd + 1] + " 9:30 AM";
  return "Mon 9:30 AM";
}
// One short line: market closed (and when it opens) and/or big news in the next 24 hours.
function infoLine(m, noTrend) { // noTrend: callout cards (a callout always goes with the trend)
  const parts = [], c = closedUntil(m.kind), now = Date.now() / 1000, crude = /^M?CL=F$/.test(m.sym);
  // Her top-down trend: only trades in this direction are called out; none when there's no clear trend.
  if (m.trend && !noTrend) parts.push(m.trend.dir ? '<span class="' + (m.trend.dir === "up" ? "ok" : "bad") + '" title="Her top-down trend (Weekly, or Daily if the Weekly is unclear). Bounces only trade this way; breaks catch reversals.">Trend ' + (m.trend.dir === "up" ? "↑ up" : "↓ down") + " (" + m.trend.from + ")" + "</span>"
    : '<span class="warn" title="No clear trend on the Weekly or Daily: no bounce trades until one forms">No clear trend: no bounces</span>');
  if (noTrend) { const y = yr2(m, true); if (y) parts.push(y); } // callout cards: the market's 2-year result, on this line to keep the box small
  if (c) parts.push('<span title="Market closed. New York time.">Opens ' + c + "</span>");

  const cau = [], when = (t) => (t <= now ? "just out" : new Date(t * 1000).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }));

    cau.push({ level: "big", t, own: true, text: "Earnings " + d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "America/New_York" }) + (er.when ? " " + er.when : "") });
  }

  const cauTxt = cau.length ? '⚠ <b class="' + LV[cau[0].level][1] + '">' + LV[cau[0].level][0] + ":</b> " + esc(cau[0].text) + (cau.length > 1 ? ' <span class="mu">+' + (cau.length - 1) + "</span>" : "") : "";
  const tip = esc(cau.map((x) => LV[x.level][0] + ": " + x.text).join(" · "));

  // Trend, market hours and the caution share one line (keeps every box small).
  if (cau.length) return '<div class="note mini cau" title="' + tip + '">' + (parts.length ? parts.join(" · ") + " · " : "") + cauTxt + "</div>";
  return parts.length ? '<div class="note mini">' + parts.join(" · ") + "</div>" : "";
}
const chartTF = () => "4H"; // everything runs on the 4-hour chart (the server still supports ?tf=1H|both, unused)
function merge() {

  const have = new Set((a.markets || []).map((m) => m.sym));
  data = { at: a.at || b.at || Date.now(), markets: (a.markets || []).concat((b.markets || []).filter((m) => !have.has(m.sym))),
    scanned: b.scanned, scanErr: !!stockPart && !b.markets, scanning, stockRecord: b.record || null, stockRanks: (stats2y && stats2y.ranks) || b.ranks || null, stockRecord2y: !!(stats2y && stats2y.record) };
  // 2-year track records (worked out once a day) replace the scan's 6 months once they've loaded.
  if (stats2y && stats2y.record && stats2y.record.trades) data.stockRecord = stats2y.record;
  if (fut2y) data.markets.forEach((m) => { if (m.kind === "futures" && fut2y[m.sym]) { m.record = fut2y[m.sym]; m.record2y = true; } });
}
async function load() {
  if (loading) return;

  const fut = (mine.length ? fetch("/api/trades?s=" + encodeURIComponent(mine.join(",")) + "&tf=" + chartTF(), { cache: "no-store" }).then((r) => r.json()) : Promise.resolve({ markets: [], at: Date.now() }))
    .then((a) => { if (!a.markets) throw new Error(a.error || "no data"); futPart = a; lastErr = null; merge(); notifyNew(); render(); })
    .catch((e) => { if (!futPart) lastErr = e.message || "load failed"; render(); });
  const stk = fetch("/api/scan?tf=" + chartTF()).then((r) => r.json()).catch(() => ({ error: "scan failed" }))
    .then((b) => { stockPart = b; scanning = false; merge(); notifyNew(); render(); });
  const nws = fetch("/api/news").then((r) => r.json()).then((n) => { newsEvents = n.events || []; render(); }).catch(() => {});
  // Track records and the Respects trendlines list: 2 years, worked out once a day on the server (slow the first
  // time each day; the 6-month numbers show until then).
  if (!stats2y) fetch("/api/scan?stats=1").then((r) => r.json()).then((j) => { if (j.record) { stats2y = j; merge(); render(); if (typeof sendFocus === "function") sendFocus(); } }).catch(() => {});
  if (!fut2y) fetch("/api/trades?stats=1&tf=4H&s=" + encodeURIComponent(symbols().filter((x) => /=F$/.test(x)).join(","))).then((r) => r.json()).then((j) => {
    const o = {}; (j.markets || []).forEach((x) => { if (x.record) o[x.sym] = x.record; }); if (Object.keys(o).length) { fut2y = o; merge(); render(); }
  }).catch(() => {});

  await Promise.all([fut, stk, nws]);

}

function callouts() {

  const out = [];
  data.markets.forEach((m) => { if (!m.error && m.kind === kind && inFocus(m.sym, m.kind)) (m.signals || []).forEach((s) => out.push({ m, s })); });
  return out;
}

const OPTION_LIQUID = new Set(["SPY", "QQQ", "IWM", "DIA", "SMH", "XLF", "XLE", "XLK", "GLD", "SLV", "TLT", "ARKK",

function inFocus(sym, k) { if (k !== "stocks") return true; const f = focusStocks(); return !f || f.includes(sym); }

function notifyNew() {
  // seen: callout key -> first time this browser saw it. On the very first visit nothing counts as new.
  const seen = store.get("seen", null), next = {}, fresh = [], t = Date.now();
  if (seen) Object.keys(seen).forEach((k) => { if (seen[k] > t - 7 * 864e5) next[k] = seen[k]; });
  data.markets.forEach((m) => (m.signals || []).forEach((s) => {
    const k = keyOf(m, s);
    if (seen && !seen[k] && s.status === "open") fresh.push({ m, s });
    if (!next[k]) next[k] = t;
  }));
  fresh.forEach(({ m, s }) => window._fresh.add(keyOf(m, s)));
  store.set("seen", next);
  if (!fresh.length) return;
  document.title = "(" + fresh.length + ") Trade Finder";
  if (store.get("alerts", false) && "Notification" in window && Notification.permission === "granted") {
    fresh.slice(0, 3).forEach(({ m, s }) => {
      try { new Notification(action(m, s) + " " + show(m.sym) + " (" + s.setup + ")", { body: s.tf + " chart · entry " + num(s.entry, m.digits) + " · stop " + num(s.stop, m.digits) + " (trail it on the safety line)", tag: keyOf(m, s) }); } catch (e) { /* some phones only allow notifications from an installed app */ }
    });
  }
}

// 4-hour or 1-hour candles with her chains: green = rising lines under the lows, red = falling lines over the
// highs. The action line is drawn thick, the safety line dashed.
// Strong support/resistance levels (4+ turns, the 2 nearest above and below price): faint dashed lines across the chart, labeled with
// how many times price turned there. Only the ones inside the chart's price range are drawn.
function levelMarks(levels, Y, x0, x1, lo, hi) {
  const shown = (levels || []).filter((v) => v.p > lo && v.p < hi), placed = [];
  // Labels go to the strongest levels first; one that would sit on top of another label is left off.
  shown.slice().sort((a, b) => b.n - a.n).forEach((v) => { const y = Y(v.p); if (placed.every((q) => Math.abs(q - y) >= 11)) { placed.push(y); v._lab = true; } });
  return shown.map((v) => {
    const y = Y(v.p), lab = v._lab; delete v._lab;
    return '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="var(--warn)" stroke-width="1" stroke-dasharray="6 5" opacity=".55"/>' +
      (lab ? '<text x="' + (x0 + 3) + '" y="' + (y - 3) + '" font-size="10" fill="var(--warn)" opacity=".85">' + (v.side === "R" ? "R" : "S") + " ×" + v.n + "</text>" : "");
  }).join("");
}
// A tap on the chart: solid dot = the wick reached the line; hollow dashed ring = a near miss (came close, stopped short).
const tapMark = (x, y, col, near) => near ? '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-dasharray="2 2"/>'
  : '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + col + '" stroke="var(--card)" stroke-width="1.5"/>';
// One small line under each chart: which of her setups this market takes, and how trades exit.
function stratNote(m) {
  const ex = " · exit at the next bigger-timeframe line or S/R level, or the safety line";
  const t = /^M?CL=F$/.test(m.sym) ? "breaks and break &amp; retests · no new trades 4 days before the contract switch" : "breaks, break &amp; retests, bounces with the trend";
  return '<div class="note mini stn"><b>Strategy:</b> ' + t + ex + "</div>";
}
// The S/R levels' prices in one small line under a chart, highest first: "R 4,383.7 ×5 · R 4,266.6 ×6 · S 4,077.9 ×5".
// How strong a level has been: how often price came back to it and held vs broke through.
function srHist(v) {
  if (!v || !v.tests) return "";
  const pct = Math.round((100 * v.held) / v.tests), when = v.lastBreak ? new Date(v.lastBreak * 1000).toLocaleDateString("en-US", { month: "short", year: "numeric" }) : "";
  return "held " + v.held + " of " + v.tests + " tests (" + pct + "%)" + (v.fake ? " · " + v.fake + " fake break" + (v.fake > 1 ? "s" : "") : "") + (v.broke ? " · broke for good " + v.broke + "×" + (when ? " (last " + when + ")" : "") : " · never broke for good");
}
// The S/R levels under a chart, highest first, one per line: price, turns, and how it has held up.
function srNote(levels, d) {
  const lv = (levels || []).slice().sort((a, b) => b.p - a.p);
  if (!lv.length) return "";
  return '<div class="note mini srn"><div>S/R levels (all the daily history):</div>' + lv.map((v) => '<div><b style="color:var(--warn)">' + v.side + " " + num(v.p, d) + "</b> ×" + v.n + (v.tests ? ' <span class="mu">· ' + srHist(v) + "</span>" : "") + "</div>").join("") + "</div>";
}
function chart(m, s) {
  const C = s.chart, B = C.bars, n = B.length, end = n - 1;
  // Start a few candles before the action line's first tap when it's in the data (up to ~300 candles), so every
  // tap shows; otherwise the usual last ~120 candles. Older taps show on the 3-month and 2-year views.
  const tap0 = (C.tapIdx || []).length ? C.tapIdx[0] : Infinity;
  const from = Math.max(0, end - 300, Math.min(C.at - 70, end - 120, tap0 - 6));
  const view = B.slice(from);
  const lv = (ln, i) => ln.p0 + ln.slope * (i - ln.i0);

  view.forEach((b) => { hi = Math.max(hi, b[2]); lo = Math.min(lo, b[3]); });
  [s.stop, s.entry].forEach((v) => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad;

  const GREEN = "#1fa463", RED = "#d64545";

  g += levelMarks(C.levels, Y, L, W - R, lo, hi);

    g += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + Y(b[2]) + '" y2="' + Y(b[3]) + '" stroke="' + col + '" stroke-width="1" opacity=".75"/>';
    const y1 = Y(Math.max(b[1], b[4])), y2 = Y(Math.min(b[1], b[4]));
    g += '<rect x="' + (X(i) - cw * 0.35) + '" y="' + y1 + '" width="' + Math.max(1, cw * 0.7) + '" height="' + Math.max(1, y2 - y1) + '" fill="' + col + '" opacity=".75"/>';
  });

  (C.chains || []).forEach((e) => { if (e.i1 >= from - 400) g += seg(e, Math.max(e.i0, from - 400), e.i1, e.up ? GREEN : RED, "", 1.2, 0.55); });

  const actUp = C.line && C.line.slope > 0;
  if (C.line) g += seg(C.line, Math.max(from - 400, C.line.i0), end, actUp ? GREEN : RED, "", 2.6);
  const nearAt = new Set((C.taps || []).filter((q) => q.near).map((q) => q.t));
  (C.tapIdx || []).filter((i) => i >= from).forEach((i) => { g += tapMark(X(i), Y(lv(C.line, i)), actUp ? GREEN : RED, nearAt.has(B[i] && B[i][0])); });
  if (C.safety) g += seg(C.safety, Math.max(from - 400, C.safety.i0), end, C.safety.slope > 0 ? GREEN : RED, "6 4", 2.2);

  g += "</g>";
  const hl = (v, col, lab) => {
    if (v == null) return "";

    return '<line x1="' + X(Math.max(from, C.at)) + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="' + col + '" stroke-width="1.3" stroke-dasharray="2 3"/>' +
      '<text x="' + (W - R + 4) + '" y="' + (y + 4) + '" font-size="11" fill="' + col + '" font-weight="700">' + lab + "</text>";
  };
  g += hl(s.entry, "var(--mu)", "Entry") + hl(s.stop, "var(--bad)", s.status === "open" ? "Stop now" : "Stop");
  g += '<line x1="' + X(C.at) + '" x2="' + X(C.at) + '" y1="' + T + '" y2="' + (H - Bm) + '" stroke="var(--mu)" stroke-width="1" opacity=".35"/>';
  const d0 = etFmt.format(new Date(view[0][0] * 1000)).split(",").slice(0, 2).join(","), d1 = etFmt.format(new Date(view[view.length - 1][0] * 1000)).split(",").slice(0, 2).join(",");
  g += '<text x="' + L + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)">' + esc(d0) + '</text><text x="' + (W - R) + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)" text-anchor="end">' + esc(d1) + "</text>";
  return '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + TFNAME[s.tf] + " chart of " + esc(show(m.sym)) + ' with the trendlines">' + g + "</svg>" +
    // Legend in reading order: the lines, what the thick and dashed ones are, the marks, then the S/R levels.
    '<div class="lg"><span><i style="background:#1fa463"></i>Rising lines</span><span><i style="background:#d64545"></i>Falling lines</span>' + (C.safety ? "<span>Dashed = safety line</span>" : "") + "<span>Thick = action line</span><span>● touch ◌ near miss</span>" + (C.closedAt != null ? "<span>○ = exit</span>" : "") + ((C.levels || []).length ? '<span><i style="background:var(--warn);opacity:.6"></i>S/R level (×touches)</span>' : "") + "</div></div>";
}

const TFSHORT = { Monthly: "M", Weekly: "W", Daily: "D", "4-hour": "4H", "1-hour": "1H" };
// Zoomed views with the lines drawn as rays (her ray tool), labeled by the chart each comes from.
// "mid": about 3 months of 4-hour candles with the Daily and 4-hour lines (and 1-hour ones on a 1-hour callout).
// "zoom": about 2 years of daily candles with every line.
function lineView(m, s, mode) {
  const C = s.chart, V = mode === "mid" ? C.mid : { bars: C.zoom || [], X0: 0, dX: 1 };
  const B = (V && V.bars) || [], n = B.length;
  if (!n) return "";
  const want = mode === "mid" ? ["Daily", "4-hour"].concat(s.tf === "1H" ? ["1-hour"] : []) : null;
  const lines = (C.lines || []).filter((l) => !want || want.includes(l.tf) || l.action || l.safety);
  let hi = -Infinity, lo = Infinity;
  B.forEach((b) => { hi = Math.max(hi, b[2]); lo = Math.min(lo, b[3]); });
  const pad = (hi - lo) * 0.08; hi += pad; lo -= pad;
  const W = 640, H = 300, L = 4, R = 64, T = 8, Bm = 18, Xa = V.X0, Xb = V.X0 + (n + 3) * V.dX;
  const X = (x) => L + ((x - Xa) / (Xb - Xa)) * (W - L - R), Y = (p) => T + ((hi - p) / (hi - lo)) * (H - T - Bm);
  const GREEN = "#1fa463", RED = "#d64545", cw = (W - L - R) / (n + 4);
  let g = '<defs><clipPath id="zc' + mode + '"><rect x="' + L + '" y="' + T + '" width="' + (W - L - R) + '" height="' + (H - T - Bm) + '"/></clipPath></defs><g clip-path="url(#zc' + mode + ')">';
  g += levelMarks(C.levels, Y, L, W - R, lo, hi);
  B.forEach((b, i) => {
    const x = X(V.X0 + (i + 0.5) * V.dX), col = b[4] >= b[1] ? "var(--gd)" : "var(--bad)";
    g += '<line x1="' + x + '" x2="' + x + '" y1="' + Y(b[2]) + '" y2="' + Y(b[3]) + '" stroke="' + col + '" stroke-width="1" opacity=".6"/>';
    if (mode === "mid") { const y1 = Y(Math.max(b[1], b[4])), y2 = Y(Math.min(b[1], b[4])); g += '<rect x="' + (x - cw * 0.3) + '" y="' + y1 + '" width="' + Math.max(1, cw * 0.6) + '" height="' + Math.max(1, y2 - y1) + '" fill="' + col + '" opacity=".6"/>'; }
  });
  const lab = [];
  lines.forEach((l) => {
    const a = Math.max(l.X0, Xa - 2 * V.dX), v = (x) => l.P0 + l.slopeX * (x - l.X0), col = l.up ? GREEN : RED;
    g += '<line x1="' + X(a) + '" x2="' + X(Xb) + '" y1="' + Y(v(a)) + '" y2="' + Y(v(Xb)) + '" stroke="' + col + '" stroke-width="' + (l.action ? 2.8 : 1.6) + '"' + (l.safety ? ' stroke-dasharray="6 4"' : "") + ' stroke-linecap="round"/>';
    const y = Y(v(Xb));
    if (y > T && y < H - Bm) lab.push({ y, t: TFSHORT[l.tf] || l.tf, col });
  });
  lines.forEach((l) => { (l.taps || []).forEach((q) => { if (q.X >= Xa && q.X <= Xb) g += tapMark(X(q.X), Y(q.p), l.up ? GREEN : RED, q.near); }); });
  const act = lines.find((l) => l.action);
  (C.taps || []).forEach((q) => { if (act && q.X >= Xa && q.X <= Xb) g += tapMark(X(q.X), Y(q.p), act.up ? GREEN : RED, q.near); });
  g += "</g>";
  lab.sort((p, q) => p.y - q.y).forEach((l, i, a) => { if (i && l.y - a[i - 1].y < 11) l.y = a[i - 1].y + 11; g += '<text x="' + (W - R + 4) + '" y="' + (l.y + 4) + '" font-size="11" font-weight="700" fill="' + l.col + '">' + l.t + "</text>"; });
  const d = (t) => new Date(t * 1000).toLocaleDateString("en-US", mode === "mid" ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" });
  g += '<text x="' + L + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)">' + d(B[0][0]) + '</text><text x="' + (W - R) + '" y="' + (H - 4) + '" font-size="11" fill="var(--mu)" text-anchor="end">' + d(B[n - 1][0]) + "</text>";
  return '<div class="chart"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + (mode === "mid" ? "4-hour chart, 3 months" : "Daily chart, 2 years") + " of " + esc(show(m.sym)) + ' with trendlines">' + g + "</svg>" +
    '<div class="lg"><span><i style="background:#1fa463"></i>Rising lines</span><span><i style="background:#d64545"></i>Falling lines</span><span>Dashed = safety line</span><span>Thick = action line</span><span>● touch ◌ near miss</span><span>M W D 4H 1H = the chart each line comes from</span>' + ((C.levels || []).length ? '<span><i style="background:var(--warn);opacity:.6"></i>S/R level (×touches)</span>' : "") + "</div>" +
    (lines.length ? "" : '<div class="note">No ' + (mode === "mid" ? "Daily or 4-hour" : "") + " lines on this market right now.</div>") + "</div>";
}

  const lv = s.chart.levels || [];
  return '<div class="lns"><div class="zsw">' + opt("", TFNAME[s.tf] + " chart") + opt("mid", "3 months") + opt("zoom", "2 years") + "</div>" + stratNote(m) +

      above.map(row).join("") + '<div class="lnr now"><span>Price now</span><b>' + num(m.price, d) + "</b></div>" + below.map(row).join("") +

function checks(s) {

}

// Option contracts for live stock callouts (calls for longs, puts for shorts). Loaded when asked.
// Option price "now": the Cboe quote is 15 minutes old, but the stock price on the page is close to live.
// Move the option by how far the stock moved since (delta + gamma), never below what it's worth at expiry.
// Skipped if the two stock prices are more than 5% apart (different sessions or bad data).
function estNow(c, quotedPx, livePx) {
  if (!(quotedPx > 0) || !(livePx > 0) || c.mid == null || c.delta == null) return null;
  const dx = livePx - quotedPx;
  if (Math.abs(dx) / quotedPx > 0.05) return null;
  const intrinsic = Math.max(0, c.type === "call" ? livePx - c.strike : c.strike - livePx);
  const est = Math.max(intrinsic, c.mid + c.delta * dx + 0.5 * (c.gamma || 0) * dx * dx);
  return { est: Math.round(est * 100) / 100, dx, live: livePx, quoted: quotedPx };
}

function optionsBlock(m, s, k) {
  if (m.kind !== "stocks" || s.status !== "open" || s.stop == null) return "";
  const o = opts[k], shown = o && o.shown;
  let h = '<div class="ob"><button class="btn" data-opt="' + esc(k) + '" aria-expanded="' + !!shown + '">' + (shown ? "Hide option contract" : "Show best option contract (" + (s.dir === "long" ? "call" : "put") + ")") + "</button></div>";
  if (!shown) return h;
  h += '<div class="op">';
  if (o.loading) h += '<div class="note"><span class="sp"></span> Loading option prices…</div>';
  else if (o.error) h += '<div class="note bad">' + esc(o.error) + "</div>";
  else {
    const d = o.data, money = (x) => "$" + num(x, 2);
    if (!d.contracts.length) h += '<div class="note">' + esc(d.note) + "</div>";
    d.contracts.forEach((c, i) => {
      const exp = new Date(c.expiry + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit", timeZone: "UTC" });
      h += '<div class="oc"><div class="on"><span>' + esc(d.sym) + " " + esc(exp) + " $" + num(c.strike, c.strike % 1 ? 1 : 0) + " " + (c.type === "call" ? "Call" : "Put") + "</span>" + '<span class="tag ap">Best pick</span>' + "</div>" +
        (() => {
          const e = estNow(c, d.price, m.price);
          if (!e) return "";
          const ch = e.est - c.mid, same = Math.abs(ch) < 0.01;
          return '<div class="note" style="margin:4px 0 6px;color:var(--tx)">Estimated price now: <b>~' + money(e.est) + "</b> (~$" + num(e.est * 100, 0) + " per contract)" +
            (same ? " · stock hasn't moved since the quote" : ' <span class="' + (ch > 0 ? "ok" : "bad") + '">' + (ch > 0 ? "+" : "−") + money(Math.abs(ch)) + "</span> since the quote, stock " + money(e.quoted) + " → " + money(e.live)) + "</div>";
        })() +
        '<div class="og">' +
        "<span>Bid / Ask <b>" + money(c.bid) + " / " + money(c.ask) + "</b></span><span>Per contract <b>$" + num(c.cost, 0) + "</b></span>" +
        "<span>Volume <b>" + num(c.volume, 0) + "</b></span><span>Open interest <b>" + num(c.oi, 0) + "</b></span>" +
        "<span>Delta <b>" + num(c.delta, 2) + "</b></span><span>Theta <b>" + num(c.theta, 2) + "</b> <small>(" + (c.theta < 0 ? "−" : "") + "$" + num(Math.abs(c.theta) * 100, 0) + "/day)</small></span>" +
        "<span>Implied volatility <b>" + c.iv + "%</b></span><span>Expires in <b>" + c.dte + " days</b></span>" +
        "<span>" + (d.targetIsDefault ? "At 2× risk " : "At target ") + money(d.target) + ': <b class="ok">~' + money(c.atTarget) + " (+" + c.atTargetPct + "%)</b></span>" +
        "<span>At stop " + money(d.stop) + ': <b class="bad">~' + money(c.atStop) + " (" + c.atStopPct + "%)</b></span>" +
        "<span>Breakeven at expiry <b>" + money(c.breakeven) + "</b></span></div></div>";
    });
    h += '<div class="note">Bid/ask from Cboe, 15 minutes delayed. "Estimated price now" moves that price by how far the stock has moved since (using delta and gamma): usually within a few cents, less exact in fast moves or around earnings. Check the live price in your broker before buying. "At 2× risk" and "at stop" are estimates if the move happens soon; time decay lowers them the longer it takes. ' +
      "2× risk is just a yardstick (twice the stock's move to the stop). Her exit is the safety line: get out of the option when the stock closes through it. Options aren't part of Tori's strategy. See Rules.</div>";
  }
  return h + "</div>";
}

async function loadOptions(m, s, k) {
  opts[k] = { shown: true, loading: true }; render();
  const q = new URLSearchParams({ sym: m.sym, dir: s.dir, entry: s.entry, stop: s.stop0 }); // starting stop; no target, so options use 2R
  try {
    const r = await fetch("/api/options?" + q.toString());
    const j = await r.json();
    opts[k] = j.error ? { shown: true, error: j.error } : { shown: true, data: j };
  } catch (e) { opts[k] = { shown: true, error: "Option prices didn't load. Try again in a minute." }; }
  render();
}

// Position size from her 1-2% rule: how many contracts/shares so the starting risk fits your risk budget.
function sizeLine(m, s, short) {
  const acct = store.get("acct", 0), pct = store.get("riskP", 1);
  if (!acct || s.risk == null || s.status !== "open") return "";
  const budget = (acct * pct) / 100, per = m.pointValue ? s.risk * m.pointValue : s.risk, unit = m.pointValue ? "micro contract" : "share";
  const n = Math.floor(budget / per);
  if (short) return n < 1 ? '<div class="note mini warn">Size: 1 ' + unit + " risks $" + num(per, 0) + ", more than your " + pct + "%</div>"
    : '<div class="note mini">Size: <b>' + n + " " + unit + (n > 1 ? "s" : "") + "</b> · about $" + num(n * per, 0) + " risk</div>";
  if (n < 1) return '<div class="note warn">Size: 1 ' + unit + " risks $" + num(per, 0) + ", more than your " + pct + "% ($" + num(budget, 0) + "). Skip it, or it's a high-risk setup for your account.</div>";
  return '<div class="note">Size: <b>' + n + " " + unit + (n > 1 ? "s" : "") + "</b>, risking about $" + num(n * per, 0) + " (" + pct + "% of $" + num(acct, 0) + " = $" + num(budget, 0) + ")" + (m.kind === "stocks" ? ". With options, use the dollar risk, not the share count." : "") + "</div>";
}

// 2-yr badge: this market's own 2-year result with her rules (from the daily 2-year numbers).
function yr2(m, short) {
  const r = m.kind === "futures" ? (m.record2y && m.record) : stats2y && stats2y.bySym && stats2y.bySym[m.sym];
  if (!r) return "";
  if (!r.trades) return '<span class="tag" title="This market\u2019s 2-year result with her rules">2-yr: no trades</span>';
  const pct = (r.totalR >= 0 ? "+" : "−") + Math.abs(r.totalR).toFixed(1) + "%";
  return '<span class="tag ' + (r.totalR >= 0 ? "tok" : "tbad") + '" title="This market\u2019s 2-year result with her rules, at 1% risk per trade (' + r.trades + ' trades)">2-yr' + (short ? " " + pct : ": " + r.trades + " trades · " + pct) + "</span>";
}
// Setup odds: how this setup did over 2 years on this kind of market (all futures, or all scanned stocks).
function setupOdds(m, s) {
  const k = s.setup === "bounce" ? "bounce" : s.setup === "break & retest" ? "retest" : "break", name = { bounce: "bounces", retest: "break & retests", break: "breaks" }[k];
  const parts = m.kind === "futures" ? data.markets.filter((q) => q.kind === "futures" && q.record2y && q.record && q.record.bySetup).map((q) => q.record.bySetup[k]).filter(Boolean)
    : stats2y && stats2y.record && stats2y.record.bySetup && stats2y.record.bySetup[k] ? [stats2y.record.bySetup[k]] : [];
  const n = parts.reduce((a, x) => a + x.trades, 0), w = parts.reduce((a, x) => a + x.wins, 0), r = parts.reduce((a, x) => a + x.totalR, 0);
  if (!n) return "";
  return '<div class="note mini">2-yr odds, ' + (m.kind === "futures" ? "futures " : "stocks ") + name + ": <b>" + Math.round((100 * w) / n) + '% wins</b> · <b style="color:var(' + (r >= 0 ? "--gd" : "--bad") + ')">' + (r >= 0 ? "+" : "−") + Math.abs(r / n).toFixed(2) + "% per trade</b> (" + n + " trades)</div>";
}
// Real touches badge: green when 3+ wicks actually reached the line (lines she'd count), amber when some taps
// were only near misses. x: a callout, watch line or look-up line with taps and real.
function touchBadge(x, short) {
  if (x.real == null || !x.taps) return "";
  const near = x.taps - x.real;
  if (short) return x.real >= 3 ? '<span class="tag tok" title="3+ wicks actually reached the line">' + x.real + " real ✓</span>" : '<span class="tag tnear" title="Some taps only came close to the line">' + x.real + " real</span>";
  return x.real >= 3 ? '<span class="tag tok" title="3+ wicks actually reached the line">' + x.real + " real touches ✓</span>"
    : '<span class="tag tnear" title="Some taps only came close to the line">' + x.real + " touch" + (x.real === 1 ? "" : "es") + (near ? " + " + near + " near" : "") + "</span>";
}
function card(m, s) {

    '<span class="tag">' + esc(s.tf) + '</span><span class="tag">' + esc(s.setup) + '</span><span class="tag ' + (s.grade === "A+" ? "ap" : "") + '">' + s.grade + " · " + s.passed + "/4</span>" + (isNew ? '<span class="tag new">NEW</span>' : "") +

  const status = canEnter(s) ? '<div class="st ok" style="font-size:15px">▶ GET IN NOW: ' + action(m, s) + " " + esc(show(m.sym)) + (m.kind === "stocks" ? " (stock near " : " near ") + num(m.price, d) + (m.kind === "stocks" ? ")" : "") + "</div>"
      : open ? '<div class="st warn">Live, but already ' + signR(s.nowR) + " past entry. Late to get in: wait for the next callout.</div>"
      : '<div class="st ' + st[1] + '">' + st[0] + (s.status === "closed" && s.exitPx != null ? " at " + num(s.exitPx, d) + (s.exitHow ? " (" + esc(s.exitHow) + ")" : "") : "") + "</div>";
  // Collapsed: a compact summary like the watch list. Tap the box for everything.
  if (!big) return '<article class="c cl sm" tabindex="0" data-k="' + esc(k) + '" aria-expanded="false">' +
    '<div class="top"><div style="min-width:0"><span class="sym">' + esc(show(m.sym)) + '</span> <span class="tag ' + s.dir + '">' + s.dir.toUpperCase() + '</span><span class="tag ' + (s.grade === "A+" ? "ap" : "") + '">' + s.grade + " · " + s.passed + "/4</span>" + touchBadge(s, true) + (isNew ? '<span class="tag new">NEW</span>' : "") + "</div>" +
    '<div class="mu" style="font-size:12px;text-align:right;white-space:nowrap">' + ago(s.t) + ' · <span class="tog">Details ▾</span></div></div>' +
    status.replace('style="font-size:15px"', "") + infoLine(m, true) +
    '<div class="mini">Entry <b>' + num(s.entry, d) + "</b> · Stop order <b>" + num(s.stop, d) + "</b>" + (res != null ? ' · <b class="' + (res >= 0 ? "ok" : "bad") + '">' + signR(res) + "</b>" : "") + "</div>" + sizeLine(m, s, true) + "</article>";
  // Expanded: the numbers, then three short sections (exit plan, why this trade, chart). Long lists fold away.
  const dol = (x) => (pv ? '<small class="sub">' + x + "</small>" : "");

    if (s.target) plan.push(["Target", "<b>" + num(s.target.price, d) + "</b> (" + signR(s.target.r) + ") · " + (s.target.tf === "S/R" ? "the " + (s.dir === "long" ? "resistance" : "support") + " level ahead (turned " + s.target.touches + "×)" : "the " + esc(s.target.tf) + " trendline ahead (moves with the line)")]);

  }
  const warns = (s.liveThrough ? '<div class="note warn">Price is through the safety line on the candle that\'s still forming. If it closes there, the trade is over.</div>' : "") +
    (s.mixed ? '<div class="note warn">Mixed signal: another line on this market says the opposite on the same candle. Be careful here.</div>' : "");
  const why = (s.setup === "bounce" ? "Tagged" : s.setup === "break & retest" ? "Broke, then retested," : "Broke") + " a " + lineWord + " <b>" + esc(s.lineTF) + "</b> line (from " + dateOf(s.lineFrom) + ") on the " + TFNAME[s.tf] + " chart · " + when(s.t) +
    (s.replaced ? " · replaced " + s.replaced + " older callout" + (s.replaced > 1 ? "s" : "") : "");
  return '<article class="c cl" tabindex="0" data-k="' + esc(k) + '" aria-expanded="true">' + head + status + infoLine(m, true) +

// How far price is from a line, in price: stocks in $, futures in points plus $ per micro contract.
function away(m, w) {

}

// Days until a B line becomes A+, if 3 weeks of history is the only rule it's missing and it's within a week.
function soonAplus(w) {
  const c = w.checks || {};

  const left = 21 - w.days;
  return left >= 1 && left <= 7 ? left : null;
}

    "<li><b>Position size</b>" + A + " once you enter your account size below: risk <b>1–2%</b> of your account per trade. Use micros if a mini is too big. Results across the site are shown as % of your account at 1% risk per trade (at 2%, double them).</li>" +
    "<li><b>Manage the trade</b>" + A + ": trail the stop along the safety line each time price makes a new swing. Some brokers do this for you, others need it done by hand. With alerts on, your phone gets <b>Move stop</b> when the stop trails to a new level.</li>" +
    "<li><b>Exit</b>" + A + ": a candle <b>closes</b> through the safety line (a quick poke isn't enough), or the stop order is hit. Trades also take profit at her other exits: the next bigger-timeframe (Daily, Weekly or Monthly) trendline or a support/resistance level price turned at 4+ times, whichever comes first. The target is on live cards. Target lines are real trendlines only: both points are swing points, 6+ candles apart. Over 2 years the three futures made +22.5% with these exits. With alerts on, your phone gets <b>Exit</b> with the result when the trade ends.</li>" +
    "<li><b>Grade it</b>" + A + " (her checklist): 3+ taps, 6+ candles apart, under 45° with 3 months on screen, 3+ weeks from first tap to the break. A+ = all 4. Your filter: at least 3 of 4, always with 3+ taps, and at least 1 week of history (her playbook minimum). A tap only counts if the line <b>held</b>: the next 2 candles didn't close through it. A touch that the break starts from right away is part of the break, not a tap. The badge shows how many taps were <b>real touches</b>: green <b>3 real touches ✓</b> = lines she'd count; amber <b>2 touches + 1 near</b> = one tap only came close. On charts, solid dots are touches and hollow rings near misses.</li>" +
    "<li><b>Check the cautions</b>" + Y + " before you get in. Cards show what's coming, on one line, and how much it usually moves the market: <b>⚠ Big</b> (CPI, the Fed, jobs, a stock's earnings, the crude oil report on crude) or <b>⚠ Moderate</b> (smaller US releases). Big news can blow straight through a trendline, so think twice about entering right before it.</li>" +
    "<li><b>Redraw daily</b>" + A + ": after price breaks a line, move point B to the new high or low so nothing pokes through. Trade Finder redraws every scan.</li>" +
    "<li><b>Commit to one timeframe</b>" + A + ": she picks one chart for entries and exits and doesn't jump between them. Trade Finder uses the 4-hour chart.</li>" +
    "<li><b>Journal every trade</b>" + Y + " and tag the setup: break, break &amp; retest, or bounce. Compare them after 30–50 trades. Only size up when your numbers show you're consistent. Use any journal you like (her playbook is on TradeZella, or a simple spreadsheet), and note whether each line had 3 real touches.</li>" +
    "<li><b>Practice first</b>" + Y + ": paper trade with a realistic account size until it's consistent.</li></ol>" +
    '</div>';
}

const etParts = (ms) => { const p = {}; new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", hour12: false, weekday: "short" }).formatToParts(new Date(ms)).forEach((x) => { p[x.type] = x.value; }); return p; };
function etToMs(y, mo, d, h, mi) { // a New York wall-clock time -> ms
  let g = Date.UTC(y, mo - 1, d, h, mi) + 5 * 3600000;
  for (let i = 0; i < 2; i++) { const p = etParts(g), got = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute); g += Date.UTC(y, mo - 1, d, h, mi) - got; }
  return g;
}
// Market open / closed countdown (New York time, no holidays). Stocks: 9:30 AM-4 PM Mon-Fri.
// Futures: Sunday 6 PM to Friday 5 PM, with a break 5-6 PM each weekday.
function session(k, now = Date.now()) {
  const DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }, ev = [];
  for (let day = -1; day < 8; day++) {
    const p = etParts(now + day * 86400000), dow = DOW[p.weekday], at = (h, mi) => etToMs(+p.year, +p.month, +p.day, h, mi);
    if (k === "futures") { if (dow <= 4) ev.push({ t: at(18, 0), open: true }); if (dow >= 1 && dow <= 5) ev.push({ t: at(17, 0), open: false }); }
    else if (dow >= 1 && dow <= 5) { ev.push({ t: at(9, 30), open: true }); ev.push({ t: at(16, 0), open: false }); }
  }
  const next = ev.filter((e) => e.t > now).sort((a, b) => a.t - b.t)[0];
  return next ? { isOpen: !next.open, t: next.t } : null; // the next event is a close -> open now
}
function countdown() {
  const el = $("cd");
  if (!el) return;
  const s = session(kind);
  if (!s) { el.textContent = ""; return; }
  const left = s.t - Date.now(), h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
  el.innerHTML = (s.isOpen ? "Market Closes In " : "Market Opens In ") + "<b>" + (h >= 24 ? Math.floor(h / 24) + "d " + (h % 24) + "h" : h ? h + "h " + m + "m" : m + "m") + "</b>";
}
setInterval(countdown, 30000);

const PULL = 90; // pixels to pull down before a refresh
const SKELETON = '<div class="sk tall"></div><div class="sk"></div><div class="sk"></div>';
let lastView = "";
function render() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll("#kinds button").forEach((b) => b.classList.toggle("on", b.dataset.k === kind));
  $("kinds").style.display = tab === "rules" ? "none" : "";
  $("mine").style.display = tab === "calls" || tab === "watch" ? "" : "none"; // settings only under Callouts and Watch list
  const sub = $("sub");
  if (data) {
    const bad = data.markets.filter((m) => m.error);
    sub.innerHTML = "Updated " + esc(new Date(data.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })) + (loading ? ' <span class="sp"></span>' : "") +
      (data.scanning ? " · scanning stocks…" : data.scanned ? " · scanned " + data.scanned + " stocks" : data.scanErr ? ' · <span class="warn">stock scan failed</span>' : "") +
      (bad.length ? ' · <span class="warn">no data for ' + esc(bad.map((m) => show(m.sym)).join(", ")) + "</span>" : "") + (lastErr ? ' · <span class="bad">refresh failed</span>' : "");
  } else if (lastErr) sub.innerHTML = '<span class="bad">Could not load prices (' + esc(lastErr) + ").</span> Retrying in 5 minutes.";
  const out = $("out"), typing = document.activeElement && document.activeElement.id === "lookIn" ? document.activeElement : null, typed = typing ? [typing.value, typing.selectionStart] : null;
  $("kinds").style.display = tab === "rules" ? "none" : "";
  // Fade in only when the view changes (tab, futures/stocks, first prices), so taps and refreshes don't blink.
  const view = tab + "|" + kind + "|" + !!data;
  out.classList.toggle("anim", view !== lastView); lastView = view;
  if (tab === "rules") out.innerHTML = renderRules();
  else if (!data) out.innerHTML = lastErr ? '<div class="c err empty">Prices didn\'t load. <button class="btn" id="retry">Try again</button></div>' : SKELETON;
  else {
    // While the stock scan runs: a note on the Stocks tab, and placeholders if no stocks are showing yet.
    const wait = kind === "stocks" && data.scanning ? '<div class="note" style="margin:0 2px 8px">Scanning about 110 stocks… the first scan can take up to 30 seconds.</div>' : "";
    out.innerHTML = wait && !data.markets.some((m) => m.kind === "stocks") ? wait + SKELETON : wait + (tab === "calls" ? renderCalls() : renderWatch());
  }
  if (typed && $("lookIn")) { const li = $("lookIn"); li.value = typed[0]; li.focus(); try { li.setSelectionRange(typed[1], typed[1]); } catch (e) { /* ok */ } } // a refresh while typing keeps what you typed
  countdown();
  const al = store.get("alerts", false);
  $("alerts").textContent = al ? (store.get("push", false) ? "🔔 Phone alerts on" : "🔔 Alerts on") : "🔔 Alerts off";
  $("alerts").classList.toggle("on", al); $("alerts").setAttribute("aria-pressed", String(al));
  $("mkList").innerHTML = symbols().map((s) => "<span>" + esc(show(s)) + '<button data-rm="' + esc(s) + '" aria-label="Remove ' + esc(show(s)) + '">×</button></span>').join("") +
    (removed.length ? '<span style="padding-right:10px"><button data-reset="1" style="color:var(--ac);font-size:12px;padding:0">Restore defaults</button></span>' : "");
}

document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return; // links open normally and don't toggle the chart
  const t = e.target.closest("[data-tab],[data-k],[data-rm],[data-reset],[data-fold],[data-opt],[data-zoom],[data-wch],[data-nch],[data-och],[data-lookx],[data-wall],[data-lal],.op,.lns,#retry,.cl,#alerts");
  if (!t || t.classList.contains("op")) return;
  if (t.dataset.lal) {
    const [sym, tf2, ...rest] = t.dataset.lal.split("|"), key = rest.join("|");
    data.markets.forEach((m) => { if (m.sym === sym) (m.watch || []).forEach((w) => { if (w.tf === tf2 && w.key === key) lineAlert(m, w); }); });
    return;
  }
  if (t.dataset.wall) { store.set("watchAll", !store.get("watchAll", false)); render(); return; }
  if (t.dataset.lookx) { looked = null; render(); return; }
  if (t.dataset.och) { const k = "O" + t.dataset.och; if (wcharts[k] && wcharts[k].shown) { wcharts[k].shown = false; render(); } else if (wcharts[k] && wcharts[k].s) { wcharts[k].shown = true; render(); } else loadTradeChart(t.dataset.och); return; }
  if (t.dataset.nch) { const k = "N" + t.dataset.nch; if (wcharts[k] && wcharts[k].shown) { wcharts[k].shown = false; render(); } else if (wcharts[k] && wcharts[k].chart) { wcharts[k].shown = true; render(); } else loadNearChart(t.dataset.nch); return; }
  if (t.dataset.wch) { const k = t.dataset.wch; if (wcharts[k] && wcharts[k].shown) { wcharts[k].shown = false; render(); } else if (wcharts[k] && wcharts[k].chart) { wcharts[k].shown = true; render(); } else loadWatchChart(k); return; }
  if (t.dataset.zoom) { zoomed[t.dataset.zoom] = t.dataset.mode || ""; render(); return; }
  if (t.classList.contains("lns")) return;
  if (t.dataset.opt) {
    const k = t.dataset.opt, o = opts[k];
    if (o && (o.data || o.loading)) { o.shown = !o.shown; render(); return; } // a failed load retries
    data.markets.forEach((m) => (m.signals || []).forEach((s) => { if (keyOf(m, s) === k) loadOptions(m, s, k); }));
    return;
  }
  if (t.classList.contains("fh")) { // a fold row under a chart: open/close in place (no redraw, no blink)
    const on = (folds[t.dataset.fold] = !folds[t.dataset.fold]), fb = t.nextElementSibling;
    t.setAttribute("aria-expanded", on); t.lastElementChild.textContent = on ? "▴" : "▾"; if (fb) fb.hidden = !on;
    return;
  }
  if (t.dataset.fold) { folds[t.dataset.fold] = !folds[t.dataset.fold]; if (t.dataset.fold === "live") store.set("liveOpen", folds.live); if (t.dataset.fold === "recentBox") store.set("recentOpen", folds.recentBox); render(); }
  else if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.k && t.closest("#kinds")) { kind = t.dataset.k; store.set("kind", kind); render(); }
  else if (t.dataset.rm) { const s = t.dataset.rm; extra = extra.filter((x) => x !== s); if (!removed.includes(s) && (DEF.futures.includes(s) || DEF.stocks.includes(s))) removed.push(s); store.set("extra", extra); store.set("removed", removed); render(); load(); }
  else if (t.dataset.reset) { removed = []; store.set("removed", removed); render(); load(); }
  else if (t.id === "retry") load();
  else if (t.id === "alerts") toggleAlerts();
  else if (t.classList.contains("cl")) {
    if (t.getAttribute("aria-expanded") === "true" && e.target.closest(".chart") && !e.target.closest(".top")) return; // tapping the chart keeps it open
    const k = t.dataset.k; openCharts[k] = !openCharts[k]; render();
  }
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("cl")) { e.preventDefault(); e.target.click(); } });
(() => {
  let y0 = null, dy = 0;
  const ptr = $("ptr");
  addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 20) { ptr.classList.add("on"); ptr.textContent = dy > PULL ? "Release to refresh" : "Pull to refresh"; }
  }, { passive: true });
  addEventListener("touchend", () => {
    if (y0 != null && dy > PULL && !loading) { ptr.textContent = "Refreshing…"; refreshAll(true).then(() => ptr.classList.remove("on")); }
    else ptr.classList.remove("on");
    y0 = null; dy = 0;
  });
})();
// Focus: tell the alert server which stocks this phone gets callouts for (when the ranking changes).
let focusSent = "";
function sendFocus() {
  const f = JSON.stringify(focusPrefs());
  if (f === focusSent || !store.get("push", false) || !focusStocks()) return;
  focusSent = f;
  pushSub().then((sub) => sub && post({ action: "subscribe", sub: sub.toJSON(), prefs: { tf: chartTF(), focus: focusPrefs() } })).catch(() => { focusSent = ""; });
}
$("sizeF").addEventListener("submit", (e) => {
  e.preventDefault();
  const a = parseFloat(String($("acct").value).replace(/[$,]/g, "")), p = parseFloat($("riskP").value);
  if (a > 0) store.set("acct", a);
  if (p > 0 && p <= 10) store.set("riskP", p);
  render();
});
(() => { const a = store.get("acct", 0), p = store.get("riskP", 0); if (a) $("acct").value = a; if (p) $("riskP").value = p; })();
document.addEventListener("submit", (e) => { if (e.target.id === "lookF") { e.preventDefault(); lookUp($("lookIn").value); } });
$("add").addEventListener("submit", (e) => {
  e.preventDefault();
  let s = $("addIn").value.trim().toUpperCase();
  if (FUT_ROOTS.includes(s)) s += "=F"; // typing MGC means the futures contract
  if (!/^[A-Z0-9^][A-Z0-9.=^-]{0,14}$/.test(s)) return;
  removed = removed.filter((x) => x !== s); if (!symbols().includes(s)) extra.push(s);
  store.set("extra", extra); store.set("removed", removed); $("addIn").value = ""; render(); load();
});

// Alerts: phone alerts (Web Push) when the site's database is set up - they arrive even when the site is closed.
// Otherwise (or if the phone can't), alerts only work while the page is open.
let pushInfo = null, sparkN = 0; const lastPx = {}; // sparkline gradient ids; last prices, to flash a tile when its price changes // GET /api/push: { configured, publicKey, live }
async function pushSub() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
const post = (body) => fetch("/api/push", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const b64ToBytes = (b) => { const s2 = atob((b + "===".slice((b.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s2, (c) => c.charCodeAt(0)); };
async function toggleAlerts() {
  const on = !store.get("alerts", false);
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent), installed = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (on && pushInfo && pushInfo.configured && iOS && !installed) {
    alert("To get alerts on your iPhone, add Trade Finder to your Home Screen first (Share → Add to Home Screen), open it from there, then tap 🔔 again.");
    return;
  }
  if (on && "Notification" in window && Notification.permission !== "granted") {
    let p = "denied";
    try { p = await Notification.requestPermission(); } catch (e) { /* old Safari */ }
    if (p !== "granted") { alert("Notifications are blocked for this site. Turn them on in your phone's settings, then try again."); return; }
  }
  if (pushInfo && pushInfo.configured && "PushManager" in window) {
    try {
      if (on) {
        const reg = await navigator.serviceWorker.ready;
        const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(pushInfo.publicKey) }));
        await post({ action: "subscribe", sub: sub.toJSON(), prefs: { tf: chartTF(), focus: focusPrefs() } });
        store.set("push", true);
        post({ action: "test", endpoint: sub.endpoint }).catch(() => {});
      } else {
        const sub = await pushSub();
        if (sub) { await post({ action: "unsubscribe", endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
        store.set("push", false); store.set("lineAlerts", {});
      }
    } catch (e) { alert("Phone alerts couldn't be turned on (" + (e.message || "error") + "). Alerts will still work while this page is open."); store.set("push", false); }
  }
  store.set("alerts", on); render();
}
// Watch-list "Alert me": tell me when price reaches this line.
async function lineAlert(m, w) {
  const id = m.sym + "|" + w.tf + "|" + w.key, mine = store.get("lineAlerts", {}), sub = store.get("push", false) ? await pushSub() : null;
  if (!sub) { alert("Turn on 🔔 Alerts at the top first (phone alerts)."); return; }
  if (mine[id]) { await post({ action: "unalert", endpoint: sub.endpoint, id }).catch(() => {}); delete mine[id]; }
  else {
    const r = await post({ action: "alert", endpoint: sub.endpoint, alert: { id, sym: m.sym, tf: w.tf, key: w.key, level: w.lineNow, dir: w.kind.startsWith("rising") ? "below" : "above", label: (w.kind.startsWith("rising") ? "Rising " : "Falling ") + w.lineTF + " line" } }).catch(() => ({}));
    if (!r.ok) { alert(r.error || "The alert couldn't be saved. Try again."); return; }
    mine[id] = Date.now();
  }
  store.set("lineAlerts", mine); render();
}

// Fresh data every time the site is opened again (switching back to it, or reopening the home-screen app) and on
// pull to refresh: prices and callouts, plus the tracking and recent trades. Reopening within 15 seconds is skipped.
let lastRefresh = 0;
function loadPush() { return fetch("/api/push", { cache: "no-store" }).then((r) => r.json()).then((j) => { pushInfo = j; render(); }).catch(() => {}); }
function refreshAll(force) {
  if (!force && Date.now() - lastRefresh < 15000) return Promise.resolve();
  lastRefresh = Date.now();
  return Promise.all([loading ? Promise.resolve() : load(), loadPush()]);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { document.title = "Trade Finder"; refreshAll(); } });
addEventListener("pageshow", (e) => { if (e.persisted) refreshAll(); }); // iPhone/Safari bring back a saved copy of the page
setInterval(() => { if (!document.hidden) load(); }, REFRESH);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
lastRefresh = Date.now();
fetch("/api/push", { cache: "no-store" }).then((r) => r.json()).then((j) => {
  pushInfo = j; render();
  // Phones that picked 1-hour or Both before: back to the 4-hour chart, alerts included.
  if (store.get("tf", "4H") !== "4H") { store.set("tf", "4H"); if (store.get("push", false)) pushSub().then((sub) => sub && post({ action: "subscribe", sub: sub.toJSON(), prefs: { tf: "4H" } })).catch(() => {}); }
}).catch(() => {});
try { localStorage.removeItem("tl:journal"); } catch (e) { /* the old journal is gone */ }
render(); load();
</script>
